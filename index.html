<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vow - keep the promises you make to yourself</title>
<meta name="description" content="Free, private commitment contracts. Put a stake on a promise, name a witness, and pay your cause if you break it. No account, no subscription.">
<meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f7f3ea;
  --card: #fffdf9;
  --ink: #1d1a16;
  --muted: #645b50;
  --line: #e2d9c8;
  --seal: #a8261b;
  --seal-ink: #ffffff;
  --kept: #1d6b3a;
  --warn: #8a4f0c;
  --soft: #f0e9dc;
  --shadow: none;
  --radius: 12px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-theme="dark"] {
  --bg: #15120e;
  --card: #201c17;
  --ink: #f2ebdd;
  --muted: #b3a895;
  --line: #3a332a;
  --seal: #f05a47;
  --seal-ink: #1a0f0c;
  --kept: #4cc477;
  --warn: #f0a640;
  --soft: #2a251e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.dot.kept { background: var(--kept); }
.dot.broken { background: var(--seal); }
.dot.excused { background: var(--warn); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, var(--card)); color: var(--warn); }
.story { font: 600 17px/1.5 var(--serif); }
.heat { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 4px; }
.heat span { border-radius: 3px; background: var(--soft); }
.heat .kept { background: var(--kept); }
.heat .broken { background: var(--seal); }
.heat .excused { background: var(--warn); }
.heat .today { outline: 2px solid var(--ink); outline-offset: -1px; }
.share-link { font-size: 12px; min-height: 64px; }
.qr-wrap { margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 100%; }
.qr-wrap .qr { width: min(220px, 100%); height: auto; background: #fff; padding: 8px; border-radius: 8px; box-sizing: border-box; }
.qr-wrap figcaption { font-size: 12px; color: var(--muted, #666); }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }
header.top {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.brand svg { width: 34px; height: 34px; }
.brand b { font: 700 24px/1 var(--serif); letter-spacing: .5px; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs a {
  text-decoration: none; padding: 8px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 15px;
}
nav.tabs a[aria-current="page"] { background: var(--soft); color: var(--ink); }
h1, h2, h3 { font-family: var(--serif); line-height: 1.2; margin: 0; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px;
}
.stack > * + * { margin-top: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--card); border-radius: 12px;
  padding: 10px 16px; font-weight: 600; cursor: pointer; min-height: 44px; text-decoration: none;
  transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--seal); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--seal) 60%, transparent); outline-offset: 2px; }
.hero { padding: 28px 0 8px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat b { display: block; font: 700 24px/1.1 var(--serif); }
.stat span { font-size: 13px; color: var(--muted); }
.owed {
  border: 2px solid var(--seal); background: color-mix(in srgb, var(--seal) 8%, var(--card));
}
.vow-card { position: relative; overflow: hidden; }
.vow-card .title { font: 700 20px/1.25 var(--serif); margin: 0 0 4px; word-break: break-word; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: var(--soft); font-size: 13px; font-weight: 600;
}
.pill.stake { background: color-mix(in srgb, var(--seal) 14%, var(--card)); color: var(--seal); }
.pill.kept { background: color-mix(in srgb, var(--kept) 16%, var(--card)); color: var(--kept); }
.pill.broken { background: color-mix(in srgb, var(--seal) 16%, var(--card)); color: var(--seal); }
.pill.excused { background: color-mix(in srgb, var(--warn) 16%, var(--card)); color: var(--warn); }
.countdown { font: 700 28px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.countdown.soon { color: var(--seal); }
.pending { border-left: 3px solid var(--warn); padding: 6px 10px; background: var(--soft); border-radius: 8px; font-size: 14px; }
details.more summary { cursor: pointer; color: var(--muted); font-weight: 600; list-style: none; min-height: 44px; display: inline-flex; align-items: center; }
details.more summary::-webkit-details-marker { display: none; }
.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
label.field { display: block; }
label.field > span, .legend { display: block; font-weight: 700; margin-bottom: 6px; }
input[type=text], input[type=number], input[type=datetime-local], input[type=time], input[type=date], input[type=email], textarea, select {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  min-height: 46px;
}
textarea { min-height: 96px; resize: vertical; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label, .chips button {
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer;
  font-weight: 600; font-size: 15px; min-height: 40px; display: inline-flex; align-items: center;
}
.chips input:checked + span { color: var(--seal-ink); }
.chips label:has(input:checked) { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
.chips label:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--seal) 60%, transparent); }
.hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
.empty { text-align: center; padding: 40px 18px; }
.empty svg { width: 120px; height: 120px; }
.list { list-style: none; padding: 0; margin: 0; }
.list li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.cam video, .cam img { display: block; width: 100%; max-height: 300px; border-radius: 12px; object-fit: cover; background: var(--soft); }
.pay-alt { border-top: 1px solid var(--line, rgba(127,127,127,.25)); padding-top: 12px; }
.thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; background: var(--soft); }
dialog {
  border: 1px solid var(--line); border-radius: 20px; background: var(--card); color: var(--ink);
  padding: 22px; width: min(480px, calc(100vw - 24px)); box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
dialog::backdrop { background: rgba(20, 16, 12, .5); backdrop-filter: blur(2px); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600;
  max-width: calc(100vw - 32px); opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
.stamp-overlay {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 60; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
}
.stamp-overlay svg { width: 180px; height: 180px; animation: stamp .6s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: scale(2.4) rotate(-30deg); opacity: 0; } to { transform: scale(1) rotate(-8deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stamp-overlay svg { animation: none; } .btn { transition: none; } }
.rules { font-size: 14px; background: var(--soft); border-radius: 12px; padding: 12px 14px; }
.rules li { margin: 2px 0; }
.code { font: 700 40px/1 ui-monospace, Consolas, monospace; letter-spacing: 6px; text-align: center; padding: 16px; background: var(--soft); border-radius: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  h1 { font-size: 26px; }
  nav.tabs a { padding: 8px 9px; font-size: 14px; }
  .brand b { font-size: 21px; }
}
@media (max-width: 360px) {
  .brand b { display: none; }
}
/* ---- Design system v4: "refined paper" (see design.md) ---- */
.hero h1 { font-size: 32px; letter-spacing: -.01em; }
.stats { gap: 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); }
.stat { background: none; border: 0; border-radius: 0; padding: 12px 4px; }
.stat b { font-size: 26px; font-variant-numeric: lining-nums tabular-nums; }
.stat span { text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; }
.card { box-shadow: none; }
.pill { background: none; border: 1px solid var(--line); font-weight: 500; color: var(--muted); }
.pill.stake { border-color: var(--seal); color: var(--seal); background: none; font-weight: 700; }
.pill.kept { background: none; border-color: color-mix(in srgb, var(--kept) 45%, var(--line)); }
.pill.broken { background: none; border-color: color-mix(in srgb, var(--seal) 45%, var(--line)); }
.pill.excused { background: none; border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.pill.warn { background: none; border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)) !important; }
.btn { border-radius: 10px; }
.owed { border-width: 1px; border-top: 3px solid var(--seal); background: var(--card); }
.countdown { font-variant-numeric: lining-nums tabular-nums; }
details.more summary { gap: 8px; }
details.more summary::after {
  content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: translateY(-2px) rotate(45deg); transition: transform .15s ease;
}
details.more[open] summary::after { transform: translateY(2px) rotate(-135deg); }
@media (prefers-reduced-motion: reduce) { details.more summary::after { transition: none; } }
@media (max-width: 560px) { .stat:nth-child(n+3) { border-top: 1px solid var(--line); } .hero h1 { font-size: 28px; } }

/* ---- v7: professional polish (see design.md) ---- */
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
nav.tabs a { display: inline-flex; align-items: center; gap: 7px; }
nav.tabs .ic { width: 18px; height: 18px; }
.hero { padding: 28px 0 18px; }
.hero p { margin: 6px 0 0; }
.hero .story { font: 500 17px/1.5 var(--serif); color: var(--muted); max-width: 60ch; }
h2 { font-size: 20px; letter-spacing: -.005em; }
.card { padding: 20px; }
.layout { display: grid; gap: 16px; align-items: start; }
.layout > * { min-width: 0; }
.stats { background: var(--card); border: 1px solid var(--line); border-top: 2px solid var(--ink); border-radius: 0 0 var(--radius) var(--radius); padding: 0 14px; }
.stat { padding: 14px 4px; }
/* vow card */
.vow-card { padding: 20px 20px 8px; }
.vow-card .title { font-size: 21px; }
.meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.meta > div { padding: 10px 12px 10px 0; min-width: 0; }
.meta > div + div { padding-left: 12px; border-left: 1px solid var(--line); }
.meta dt { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.meta dd { margin: 0; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
.meta .stake-amt { color: var(--seal); }
.meta .ok { display: block; color: var(--kept); font-size: 13px; font-weight: 600; }
.meta .pill { font-size: 13px; padding: 2px 8px; margin-top: 2px; cursor: pointer; color: var(--warn); }
.vow-card .countdown { font-size: 30px; }
.vow-card details.more { border-top: 1px solid var(--line); margin-top: 14px; }
.vow-card details.more summary { width: 100%; font-size: 14.5px; }
.menu { display: flex; flex-direction: column; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.menu-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 46px;
  padding: 10px 14px; background: var(--card); border: 0; border-top: 1px solid var(--line); text-align: left;
  font-weight: 500; cursor: pointer;
}
.menu-item:first-child { border-top: 0; }
.menu-item:hover { background: var(--soft); }
.menu-item.danger { color: var(--seal); border-top: 6px solid var(--soft); font-weight: 600; }
.menu-note { font-size: 13px; color: var(--muted); font-weight: 400; }
/* owed */
.owed h2 { font-size: 22px; }
.owed .list li { align-items: center; }
/* new vow form */
.chips.ideas { margin-top: -4px; }
.chips.ideas button { font-size: 14px; min-height: 36px; padding: 6px 12px; font-weight: 500; color: var(--muted); }
.field .hint { display: block; font-weight: 400; margin-top: 6px; }
details.opts { border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; }
details.opts > summary { width: 100%; justify-content: space-between; gap: 12px; padding: 10px 0; color: var(--ink); font-weight: 400; }
details.opts > summary::after { display: none; }
.opts-text { display: flex; flex-direction: column; min-width: 0; }
.opts-label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
#opts-sum { font-weight: 600; font-size: 15px; }
.opts-edit { color: var(--seal); font-weight: 600; font-size: 14.5px; flex: none; }
details.opts[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 4px; }
details.opts[open] .opts-edit { color: var(--muted); }
.seal-note { margin: 0; font-size: 13.5px; color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: 14.5px; }
.steps b { display: block; }
/* history */
.heat { grid-template-rows: repeat(7, auto); grid-auto-columns: minmax(0, 1fr); gap: 4px; max-width: 420px; }
.heat span { aspect-ratio: 1; border-radius: 3px; }
.legend-row { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.legend-row li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 11px; height: 11px; border-radius: 3px; background: var(--soft); border: 1px solid var(--line); display: inline-block; }
.sw.kept { background: var(--kept); border-color: var(--kept); }
.sw.broken { background: var(--seal); border-color: var(--seal); }
.sw.excused { background: var(--warn); border-color: var(--warn); }
.list li .pill { font-size: 12.5px; padding: 1px 8px; margin-left: 4px; vertical-align: 1px; }
/* settings */
.danger-zone { border-color: color-mix(in srgb, var(--seal) 35%, var(--line)); }
.danger-zone h2 { color: var(--seal); }
.btn.danger { border-color: color-mix(in srgb, var(--seal) 45%, var(--line)); }
.about p { margin: 0; font-size: 15px; }
.about p + p { margin-top: 10px; }
/* dialogs */
dialog { border-radius: 16px; padding: 24px; }
dialog h2 { font-size: 22px; }
.cam { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; background: var(--soft); overflow: hidden; display: grid; place-items: center; }
.cam::before { content: "Camera preview"; color: var(--muted); font-size: 14px; }
.cam video, .cam img { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; background: transparent; border-radius: 0; }
input[type=file] { font-size: 14px; max-width: 100%; }
input[type=file]::file-selector-button {
  font: inherit; font-weight: 600; margin-right: 12px; padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
}
input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--ink); }
/* phone: bottom tab bar */
@media (max-width: 639px) {
  header.top .wrap { padding-top: 12px; padding-bottom: 12px; }
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
    background: var(--card); border-top: 1px solid var(--line); padding: 4px 8px calc(4px + env(safe-area-inset-bottom));
  }
  nav.tabs a { flex-direction: column; gap: 2px; padding: 6px 4px; border-radius: 10px; font-size: 12px; justify-content: center; min-height: 52px; }
  nav.tabs .ic { width: 22px; height: 22px; }
  nav.tabs a[aria-current="page"] { background: none; color: var(--seal); }
  .wrap { padding-bottom: 104px; }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
  .brand b { display: inline; }
  .meta { grid-template-columns: 1fr 1fr; }
  .meta > div:nth-child(3) { grid-column: 1 / -1; padding-left: 0; border-left: 0; border-top: 1px solid var(--line); }
}
/* desktop: deliberate two-column layout */
@media (min-width: 1024px) {
  .wrap { max-width: 1080px; padding-left: 32px; padding-right: 32px; }
  main.wrap:not(:has(> .layout)) { max-width: 760px; }
  .layout { grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; }
  .layout > .side { grid-column: 2; grid-row: 1; position: sticky; top: 84px; }
  .layout > .main { grid-column: 1; grid-row: 1; }
  .side .stats { grid-template-columns: 1fr 1fr; }
  .side .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .hero { padding-top: 36px; }
  .hero h1 { font-size: 34px; }
}

/* ---- v8 (hone run 2): structure ---- */
.eyebrow { margin: 0; font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.btn.secondary { background: var(--card); color: var(--ink); border: 1px solid color-mix(in srgb, var(--ink) 22%, var(--line)); }
.btn.secondary:hover { border-color: var(--ink); }
.btn .ic { width: 18px; height: 18px; }
.home-hero { align-items: flex-end; }
.hero-sub { margin: 4px 0 0; font-size: 14.5px; color: var(--muted); }
.hero-sub b { color: var(--ink); font-variant-numeric: tabular-nums; }
/* vow card */
.vow-card { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
.vow-card.lead { border-color: color-mix(in srgb, var(--seal) 35%, var(--line)); box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 6px 20px -12px color-mix(in srgb, var(--seal) 45%, transparent); }
.vow-card.lead .eyebrow { color: var(--seal); margin-bottom: -6px; }
.vc-head { display: flex; align-items: flex-start; gap: 16px; }
.vc-title { flex: 1; min-width: 0; }
.vc-title .title { margin: 0 0 2px; }
.vc-time { text-align: right; flex: none; }
.vc-time .countdown { font-size: 28px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.vc-time .small { margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0; padding: 12px 0 0; border: 0; border-top: 1px solid var(--line); }
.meta > div, .meta > div + div { display: flex; align-items: baseline; gap: 6px; padding: 0; border: 0; min-width: 0; }
.meta dt { margin: 0; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--muted); }
.meta dd { margin: 0; font-size: 14.5px; font-weight: 600; }
.meta .ok { display: inline; margin-left: 4px; font-size: 13px; }
.vc-actions { display: flex; justify-content: flex-end; }

<body>

      <a href="#history" data-route="history"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>History</span></a>
      <a href="#settings" data-route="settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></a>
    </nav>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="seal" viewBox="0 0 64 64">
      <path fill="var(--seal)" d="M32 3l5 4 6-2 3 5 6 1 1 6 5 3-2 6 4 5-4 5 2 6-5 3-1 6-6 1-3 5-6-2-5 4-5-4-6 2-3-5-6-1-1-6-5-3 2-6-4-5 4-5-2-6 5-3 1-6 6-1 3-5 6 2z"/>
      <circle cx="32" cy="32" r="17" fill="none" stroke="var(--seal-ink)" stroke-width="2.5" opacity=".9"/>
      <path d="M24 26l8 14 8-14" fill="none" stroke="var(--seal-ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<main class="wrap" id="view" tabindex="-1"></main>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const KEY = "vow.v1";
const MIN = 60e3;
const HOUR = 60 * MIN;
const DAY = 24 * HOUR;
const LOCK = 24 * HOUR;
const FREE_EDIT = 10 * MIN;
const PASS_WINDOW = 30 * DAY;
const DEBT_GRACE = 7 * DAY;
const FAR_OFF = LOCK;
const ESCALATE_FACTOR = 1.5;
const ESCALATE_CAP = 4;
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const ICS_DAYS = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 10) + now().toString(36).slice(-4);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function blankState() {
  return { version: 1, settings: { currency: "$", theme: "auto", name: "" }, vows: [], debts: [], passes: [] };
}
function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) {
      return blankState();
    }
    const data = JSON.parse(raw);
    const base = blankState();
    return { ...base, ...data, settings: { ...base.settings, ...(data.settings || {}) } };
  } catch (err) {
    return blankState();
  }
}
let S = loadState();
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (err) {
    toast("Storage is full. Export a backup in Settings.");
  }
}

/* ---------- formatting ---------- */
const money = (n) => `${S.settings.currency}${Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
function fmtWhen(ms) {
  return new Date(ms).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function fmtLeft(ms) {
  if (ms <= 0) {
    return "0m";
  }
  const d = Math.floor(ms / DAY);
  const h = Math.floor((ms % DAY) / HOUR);
  const m = Math.floor((ms % HOUR) / MIN);
  const s = Math.floor((ms % MIN) / 1000);
  if (d > 0) {
    return `${d}d ${h}h`;
  }
  if (h > 0) {
    return `${h}h ${String(m).padStart(2, "0")}m`;
  }
  return `${m}m ${String(s).padStart(2, "0")}s`;
}
function dateKey(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function toLocalInput(ms) {
  const d = new Date(ms);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function scheduleText(v) {
  if (v.kind === "once") {
    return `by ${fmtWhen(v.occ[0].due)}`;
  }
  const days = v.days.length === 7 ? "every day" : v.days.map((d) => DAY_NAMES[d]).join(", ");
  const until = v.until ? ` until ${new Date(v.until).toLocaleDateString(undefined, { day: "numeric", month: "short" })}` : "";
  return `${days} by ${v.time}${until}`;
}
const proofLabel = { photo: "Photo", note: "Written note", timer: "Focus timer", witness: "Witness code" };

/* ---------- schedule engine ---------- */
function nextDue(v, after) {
  const [h, m] = v.time.split(":").map(Number);
  const d = new Date(after);
  d.setHours(h, m, 0, 0);
  for (let i = 0; i < 15; i++) {
    if (d.getTime() > after && v.days.includes(d.getDay())) {
      return d.getTime();
    }
    d.setDate(d.getDate() + 1);
    d.setHours(h, m, 0, 0);
  }
  return null;
}
const openOcc = (v) => v.occ.find((o) => o.status === "open");
const freeEdit = (v) => now() - v.createdAt < FREE_EDIT;
// A vow is "far-off" when its next check-in is more than FAR_OFF away. Bailing out of one
// then isn't free: you owe the stake, or your witness has to sign you off.
function isFarOff(v) {
  const o = openOcc(v);
  return !!o && o.due - now() > FAR_OFF;
}

function addDebt(v, o) {
  const debt = { id: uid(), vowId: v.id, occId: o.id, title: v.title, amount: o.stake, to: v.to, at: o.due, paidAt: null, receipt: "",
    witness: v.witness || "", witnessPub: v.witnessPub || null };
  S.debts.push(debt);
  return debt;
}

function applyPending(v, p) {
  const open = openOcc(v);
  if (p.type === "lower") {
    v.stake = p.value;
    v.baseStake = Math.min(v.baseStake, p.value);
    if (open) {
      open.stake = p.value;
    }
  } else if (p.type === "push" && open) {
    open.due = p.value;
  } else if (p.type === "delete") {
    v.status = "deleted";
    if (open) {
      open.status = "cancelled";
    }
  }
}

function tick() {
  const t = now();
  const broken = [];
  let changed = false;
  for (const v of S.vows) {
    if (v.status !== "active") {
      continue;
    }
    const due = (v.pending || []).filter((p) => p.at <= t).sort((a, b) => a.at - b.at);
    for (const p of due) {
      // a deadline that passed before the change took effect still counts
      const open = openOcc(v);
      if (open && open.due <= p.at) {
        break;
      }
      applyPending(v, p);
      v.pending = v.pending.filter((x) => x !== p);
      changed = true;
    }
    let guard = 0;
    while (v.status === "active" && guard++ < 200) {
      let o = openOcc(v);
      if (!o) {
        if (v.kind !== "repeat") {
          v.status = "done";
          changed = true;
          break;
        }
        const last = v.occ[v.occ.length - 1];
        const dueAt = nextDue(v, last ? last.due : v.createdAt + 30 * MIN);
        if (dueAt === null || (v.until && dueAt > v.until)) {
          v.status = "done";
          changed = true;
          break;
        }
        o = { id: uid(), opens: last ? last.due : v.createdAt, due: dueAt, status: "open", stake: v.stake };
        v.occ.push(o);
        changed = true;
      }
      if (o.due + (o.claim ? DAY : 0) > t) {
        break;
      }
      o.status = "broken";
      o.resolvedAt = o.due;
      broken.push({ v, debt: addDebt(v, o) });
      if (v.escalate) {
        v.stake = Math.min(Math.ceil(v.stake * ESCALATE_FACTOR), v.baseStake * ESCALATE_CAP);
      }
      // pending changes that were waiting on this deadline now apply to the next one
      for (const p of (v.pending || []).filter((p) => p.at <= t)) {
        applyPending(v, p);
        v.pending = v.pending.filter((x) => x !== p);
      }
      changed = true;
    }
  }
  if (changed) {
    save();
    render();
  }
  if (broken.length) {
    confess(broken);
  }
}

/* ---------- witness codes ---------- */
const b64e = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)));
const ECDSA = { name: "ECDSA", namedCurve: "P-256" };
const bytesB64u = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64uBytes = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
const appUrl = (hash) => `${location.origin}${location.pathname}#${hash}`;
const proofMessage = (id, day) => new TextEncoder().encode(`vow:${id}:${day}`);

// The witness's private key is created and kept on the witness's device only.
async function newWitnessKeys() {
  const pair = await crypto.subtle.generateKey(ECDSA, true, ["sign", "verify"]);
  const priv = await crypto.subtle.exportKey("jwk", pair.privateKey);
  const pub = await crypto.subtle.exportKey("jwk", pair.publicKey);
  return { priv, pub: { x: pub.x, y: pub.y } };
}
async function signProof(priv, id, day) {
  const key = await crypto.subtle.importKey("jwk", priv, ECDSA, false, ["sign"]);
  const sig = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, key, proofMessage(id, day));
  return bytesB64u(new Uint8Array(sig));
}
async function verifyProof(pub, id, day, sig) {
  try {
    const key = await crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", x: pub.x, y: pub.y, ext: true }, ECDSA, false, ["verify"]);
    return await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, key, b64uBytes(sig), proofMessage(id, day));
  } catch (err) {
    return false;
  }
}
function invitePayload(v) {
  return {
    id: v.id, t: v.title, n: S.settings.name || "", kind: v.kind, to: v.to, s: money(v.stake),
    due: v.kind === "once" ? v.occ[0].due : null, days: v.days || null, time: v.time || null,
  };
}
function witnessLink(v) {
  return appUrl(`invite=${b64e(JSON.stringify(invitePayload(v)))}`);
}
const WKEY = "vow.witnessing";
function loadWitnessing() {
  try {

  } catch (err) {
    return [];

}

/* ---------- helpers ---------- */
let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
/* Minimal QR Code encoder (byte mode, error correction level M, versions 1-40).
   Follows the structure of Project Nayuki's QR Code generator (MIT). Returns an SVG string. */
const QR = (() => {
  const ECC_PER_BLOCK_M = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
  const BLOCKS_M = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];
  const ECL_FORMAT_BITS_M = 0;

  const bit = (x, i) => ((x >>> i) & 1) !== 0;

  function rawDataModules(ver) {
    let result = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const numAlign = Math.floor(ver / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (ver >= 7) {
        result -= 36;
      }
    }
    return result;
  }

  function dataCodewords(ver) {
    return Math.floor(rawDataModules(ver) / 8) - ECC_PER_BLOCK_M[ver] * BLOCKS_M[ver];
  }

  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 0xff;
  }

  function rsDivisor(degree) {
    const result = new Array(degree).fill(0);
    result[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < result.length; j++) {
        result[j] = gfMul(result[j], root);
        if (j + 1 < result.length) {
          result[j] ^= result[j + 1];
        }
      }
      root = gfMul(root, 0x02);
    }
    return result;
  }

  function rsRemainder(data, divisor) {
    const result = divisor.map(() => 0);
    for (const b of data) {
      const factor = b ^ result.shift();
      result.push(0);
      divisor.forEach((coef, i) => {
        result[i] ^= gfMul(coef, factor);
      });
    }
    return result;
  }

  function alignmentPositions(ver, size) {
    if (ver === 1) {
      return [];
    }
    const numAlign = Math.floor(ver / 7) + 2;
    const step = Math.floor((ver * 8 + numAlign * 3 + 5) / (numAlign * 4 - 4)) * 2;
    const result = [6];
    for (let pos = size - 7; result.length < numAlign; pos -= step) {
      result.splice(1, 0, pos);
    }
    return result;
  }

  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 1;
    for (; ver <= 40; ver++) {
      const countBits = ver <= 9 ? 8 : 16;
      if (4 + countBits + bytes.length * 8 <= dataCodewords(ver) * 8) {
        break;
      }
    }
    if (ver > 40) {
      throw new Error("Text too long for a QR code");
    }
    const size = ver * 4 + 17;
    const capacityBits = dataCodewords(ver) * 8;
    const bits = [];
    const push = (value, len) => {
      for (let i = len - 1; i >= 0; i--) {
        bits.push((value >>> i) & 1);
      }
    };
    push(0x4, 4);
    push(bytes.length, ver <= 9 ? 8 : 16);
    bytes.forEach((b) => push(b, 8));
    push(0, Math.min(4, capacityBits - bits.length));
    push(0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < capacityBits; pad ^= 0xec ^ 0x11) {
      push(pad, 8);
    }
    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let byte = 0;
      for (let j = 0; j < 8; j++) {
        byte = (byte << 1) | bits[i + j];
      }
      data.push(byte);
    }

    const numBlocks = BLOCKS_M[ver];
    const blockEccLen = ECC_PER_BLOCK_M[ver];
    const rawCodewords = Math.floor(rawDataModules(ver) / 8);
    const numShortBlocks = numBlocks - (rawCodewords % numBlocks);
    const shortBlockLen = Math.floor(rawCodewords / numBlocks);
    const divisor = rsDivisor(blockEccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < numBlocks; i++) {
      const dat = data.slice(k, k + shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, divisor);
      if (i < numShortBlocks) {
        dat.push(0);
      }
      blocks.push(dat.concat(ecc));
    }
    const codewords = [];
    for (let i = 0; i < blocks[0].length; i++) {
      blocks.forEach((block, j) => {
        if (i !== shortBlockLen - blockEccLen || j >= numShortBlocks) {
          codewords.push(block[i]);
        }
      });
    }

    const modules = Array.from({ length: size }, () => new Array(size).fill(false));
    const isFunction = Array.from({ length: size }, () => new Array(size).fill(false));
    const setFunction = (x, y, dark) => {
      modules[y][x] = dark;
      isFunction[y][x] = true;
    };
    for (let i = 0; i < size; i++) {
      setFunction(6, i, i % 2 === 0);
      setFunction(i, 6, i % 2 === 0);
    }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) {
        for (let dx = -4; dx <= 4; dx++) {
          const dist = Math.max(Math.abs(dx), Math.abs(dy));
          const x = cx + dx;
          const y = cy + dy;
          if (x >= 0 && x < size && y >= 0 && y < size) {
            setFunction(x, y, dist !== 2 && dist !== 4);
          }
        }
      }
    };
    finder(3, 3);
    finder(size - 4, 3);
    finder(3, size - 4);
    const align = alignmentPositions(ver, size);
    const last = align.length - 1;
    align.forEach((ax, i) => {
      align.forEach((ay, j) => {
        if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) {
          return;
        }
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            setFunction(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
          }
        }
      });
    });
    const drawFormat = (mask) => {
      const dataBits = (ECL_FORMAT_BITS_M << 3) | mask;
      let rem = dataBits;
      for (let i = 0; i < 10; i++) {
        rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      }
      const fmt = ((dataBits << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) {
        setFunction(8, i, bit(fmt, i));
      }
      setFunction(8, 7, bit(fmt, 6));
      setFunction(8, 8, bit(fmt, 7));
      setFunction(7, 8, bit(fmt, 8));
      for (let i = 9; i < 15; i++) {
        setFunction(14 - i, 8, bit(fmt, i));
      }
      for (let i = 0; i < 8; i++) {
        setFunction(size - 1 - i, 8, bit(fmt, i));
      }
      for (let i = 8; i < 15; i++) {
        setFunction(8, size - 15 + i, bit(fmt, i));
      }
      setFunction(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) {
        rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
      }
      const vbits = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const dark = bit(vbits, i);
        const a = size - 11 + (i % 3);
        const b = Math.floor(i / 3);
        setFunction(a, b, dark);
        setFunction(b, a, dark);
      }
    }

    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) {
        right = 5;
      }
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const upward = ((right + 1) & 2) === 0;
          const y = upward ? size - 1 - vert : vert;
          if (!isFunction[y][x] && i < codewords.length * 8) {
            modules[y][x] = bit(codewords[i >>> 3], 7 - (i & 7));
            i++;
          }
        }
      }
    }

    const maskFn = [
      (x, y) => (x + y) % 2 === 0,
      (x, y) => y % 2 === 0,
      (x) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
      (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
      (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
    ];
    const applyMask = (mask) => {
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (!isFunction[y][x] && maskFn[mask](x, y)) {
            modules[y][x] = !modules[y][x];
          }
        }
      }
    };
    const penalty = () => {
      let score = 0;
      for (let pass = 0; pass < 2; pass++) {
        for (let a = 0; a < size; a++) {
          let run = 1;
          for (let b = 1; b < size; b++) {
            const cur = pass === 0 ? modules[a][b] : modules[b][a];
            const prev = pass === 0 ? modules[a][b - 1] : modules[b - 1][a];
            if (cur === prev) {
              run++;
              if (run === 5) {
                score += 3;
              } else if (run > 5) {
                score++;
              }
            } else {
              run = 1;
            }
          }
        }
      }
      let dark = 0;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (modules[y][x]) {
            dark++;
          }
          if (y < size - 1 && x < size - 1) {
            const c = modules[y][x];
            if (c === modules[y][x + 1] && c === modules[y + 1][x] && c === modules[y + 1][x + 1]) {
              score += 3;
            }
          }
        }
      }
      const total = size * size;
      score += Math.floor(Math.abs(dark * 20 - total * 10) / total) * 10;
      return score;
    };
    let bestMask = 0;
    let bestScore = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      applyMask(mask);
      drawFormat(mask);
      const score = penalty();
      if (score < bestScore) {
        bestScore = score;
        bestMask = mask;
      }
      applyMask(mask);
    }
    applyMask(bestMask);
    drawFormat(bestMask);
    return { size, modules, version: ver };
  }

  function svg(text, label) {
    const { size, modules } = encode(text);
    const quiet = 4;
    const total = size + quiet * 2;
    let path = "";
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (modules[y][x]) {
          path += `M${x + quiet} ${y + quiet}h1v1h-1z`;
        }
      }
    }
    const name = String(label || "QR code").replace(/[<>&"]/g, "");
    return `<svg class="qr" viewBox="0 0 ${total} ${total}" role="img" aria-label="${name}" shape-rendering="crispEdges"><rect width="${total}" height="${total}" fill="#fff"/><path d="${path}" fill="#111"/></svg>`;
  }

  return { encode, svg };
})();

function qrBlock(link, label) {
  if (!link || link.length > 900) {
    return "";
  }
  try {
    return `<figure class="qr-wrap">${QR.svg(link, label)}<figcaption>Or scan with their phone camera</figcaption></figure>`;
  } catch (err) {
    return "";
  }
}

async function shareText(text) {
  if (navigator.share) {
    try {
      await navigator.share({ text });
      return;
    } catch (err) {
      if (err && err.name === "AbortError") {
        return;
      }
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied. Paste it to your witness.");
  } catch (err) {
    toast("Select and copy the message above.");
  }
}
function stamp(color) {
  const o = document.createElement("div");
  o.className = "stamp-overlay";
  o.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true" style="${color ? `--seal:${color}` : ""}"><use href="#seal"/></svg>`;
  document.body.appendChild(o);
  setTimeout(() => o.remove(), 900);
}

const dlg = $("#dlg");
function openDialog(html, onReady) {
  dlg.innerHTML = html;
  if (!dlg.open) {
    dlg.showModal();
  }
  $$("[data-close]", dlg).forEach((b) => b.addEventListener("click", () => dlg.close()));
  if (onReady) {
    onReady(dlg);
  }
}
function ask({ title, body = "", label, type = "text", value = "", min, ok = "OK" }) {
  return new Promise((resolve) => {
    openDialog(`
      <form method="dialog" class="stack" id="askf">
        <h2 id="dlg-title">${esc(title)}</h2>
        ${body ? `<p class="muted">${body}</p>` : ""}
        <label class="field"><span>${esc(label)}</span>
          <input id="askv" type="${type}" value="${esc(value)}" ${min !== undefined ? `min="${min}"` : ""} required></label>
        <div class="row"><span class="spacer"></span>
          <button type="button" class="btn ghost" data-close>Cancel</button>
          <button class="btn primary" value="ok">${esc(ok)}</button></div>
      </form>`, (d) => {
      const input = $("#askv", d);
      input.focus();
      $("#askf", d).addEventListener("submit", (e) => {
        e.preventDefault();
        resolve(input.value);
        d.close();
      });
      d.addEventListener("close", () => resolve(null), { once: true });
    });
  });
}

/* ---------- views ---------- */
function stats() {
  const all = S.vows.flatMap((v) => v.occ);
  const kept = all.filter((o) => o.status === "kept");
  const broken = all.filter((o) => o.status === "broken");
  const resolved = all.filter((o) => ["kept", "broken"].includes(o.status)).sort((a, b) => b.resolvedAt - a.resolvedAt);
  let streak = 0;
  for (const o of resolved) {
    if (o.status !== "kept") {
      break;
    }
    streak++;
  }
  const owed = S.debts.filter((d) => !d.paidAt).reduce((a, d) => a + d.amount, 0);
  const paid = S.debts.filter((d) => d.paidAt).reduce((a, d) => a + d.amount, 0);
  const rate = resolved.length ? Math.round((kept.length / resolved.length) * 100) : null;
  let best = 0;
  let run = 0;
  for (const o of resolved.slice().reverse()) {
    run = o.status === "kept" ? run + 1 : 0;
    best = Math.max(best, run);
  }
  const monthStart = new Date(now());
  monthStart.setDate(1);
  monthStart.setHours(0, 0, 0, 0);
  const month = all.filter((o) => (o.resolvedAt || 0) >= monthStart.getTime());
  return {
    kept: kept.length, broken: broken.length, streak, best, owed, paid, rate, saved: kept.reduce((a, o) => a + o.stake, 0),
    month: { kept: month.filter((o) => o.status === "kept").length, broken: month.filter((o) => o.status === "broken").length, excused: month.filter((o) => o.status === "excused").length },
  };
}

function owedBanner() {
  const unpaid = S.debts.filter((d) => !d.paidAt);
  if (!unpaid.length) {
    return "";
  }
  const total = unpaid.reduce((a, d) => a + d.amount, 0);
  return `<section class="owed-note" id="owed" aria-labelledby="owed-h">
    <h2 class="eyebrow" id="owed-h">You owe <span class="owed-amt">${money(total)}</span></h2>
    <ul class="list">${unpaid.map((d) => `<li>
      <div style="flex:1"><b>${money(d.amount)}</b> to ${esc(d.to)}<br><span class="small muted">for "${esc(d.title)}"<br><span class="nw">${fmtWhen(d.at)}</span>${d.askedAt ? ` <span class="nw">· asked ${esc(debtWitness(d).who)} to confirm</span>` : ""}</span></div>
      <button class="btn" data-pay="${d.id}">I paid</button></li>`).join("")}</ul>
    <p class="small muted owed-why">Pay the cause yourself, then log the receipt.</p>
  </section>`;
}

function vowCard(v, lead = false) {
  const o = openOcc(v);
  const t = now();
  const pending = (v.pending || []).map((p) => {
    const what = p.type === "lower" ? `Stake drops to ${money(p.value)}`
      : p.type === "push" ? `Deadline moves to ${fmtWhen(p.value)}`
      : p.cost === "debt" ? "Vow will be deleted — you owe the stake"
      : p.cost === "witness" ? "Vow will be deleted — witness signed off"
      : "Vow will be deleted";
    return `<div class="pending row"><span>${what} in <b data-left="${p.at}">${fmtLeft(p.at - t)}</b></span><span class="spacer"></span>
      <button class="btn ghost" data-undo="${v.id}:${p.id}">Cancel change</button></div>`;
  }).join("");
  const notOpen = o && o.opens > t;
  const witnessInfo = !v.witness ? `<span class="muted">None</span>`
    : v.witnessPub ? `${esc(v.witness)} <span class="ok">Accepted</span>`
    : v.sentAt ? `<button class="pill warn" data-act="witness" data-id="${v.id}">Waiting for ${esc(v.witness)}</button>`
    : `<button class="pill warn" data-act="witness" data-id="${v.id}">Send invite to ${esc(v.witness)}</button>`;
  return `<article class="card vow-card${lead ? " lead" : ""}" data-vow="${v.id}">
    ${lead ? `<p class="eyebrow">Next up</p>` : ""}
    <div class="vc-head">
      <div class="vc-title">
        <h3 class="title">${esc(v.title)}</h3>
        <div class="muted small">${esc(scheduleText(v))}</div>
      </div>
      ${o ? `<div class="vc-time">
        <div class="vc-time-label">${notOpen ? "Opens in" : "Time left"}</div>
        <div class="countdown ${o.due - t < 3 * HOUR ? "soon" : ""}" data-left="${notOpen ? o.opens : o.due}">${fmtLeft((notOpen ? o.opens : o.due) - t)}</div>
      </div>` : ""}
    </div>
    <dl class="meta">
      <div><dt>Stake</dt><dd><b class="stake-amt">${money(v.stake)}</b> to ${esc(v.to)}${v.escalate ? ` <span class="muted">(x1.5 on miss)</span>` : ""}</dd></div>
      <div><dt>Proof</dt><dd>${proofLabel[v.proof]}${v.proof === "timer" ? `, ${v.timerMin} min` : ""}</dd></div>
      <div><dt>Witness</dt><dd>${witnessInfo}</dd></div>
    </dl>
    ${v.plan ? `<p class="small" style="margin:0"><b>Plan:</b> ${esc(v.plan)}</p>` : ""}
    ${vowTrail(v)}
    ${pending}
    ${v.bailoutAsked && !v.bailoutSignedAt && !(v.pending || []).some((p) => p.type === "delete")
      ? `<div class="pending row"><span>Walk-away: waiting for ${esc(v.witness)} to sign off</span><span class="spacer"></span><button class="btn ghost" data-wa-resend="${v.id}">Resend</button><button class="btn ghost" data-wa-cancel="${v.id}">Cancel</button></div>` : ""}
    ${freeEdit(v) ? `<p class="small muted row" style="margin:0"><span>Typo? You can fix the wording for <b data-left="${v.createdAt + FREE_EDIT}">${fmtLeft(v.createdAt + FREE_EDIT - t)}</b>.</span> <button class="btn ghost" data-act="reword" data-id="${v.id}">Fix wording</button></p>` : ""}
    <div class="vc-foot">
    ${o ? `<div class="vc-actions">
      ${o.claim
        ? `<span class="pill warn">Waiting for ${esc(v.witness)} to confirm</span>`
        : `<button class="btn ${lead ? "primary" : "secondary"} vc-check" data-checkin="${v.id}" ${notOpen ? "disabled" : ""}>Check in</button>`}
    </div>` : ""}
    <details class="more"><summary>More options</summary>
      <div class="menu" role="group" aria-label="Vow options">
        <p class="menu-label">Change the vow</p>
        <button class="menu-item" data-act="raise" data-id="${v.id}">Raise stake</button>
        <button class="menu-item" data-act="lower" data-id="${v.id}">Lower stake</button>
        ${v.kind === "once" ? `<button class="menu-item" data-act="push" data-id="${v.id}">Push deadline</button>` : ""}
        <button class="menu-item" data-act="pass" data-id="${v.id}">Use a life-happens pass <span class="menu-note">1 per 30 days</span></button>
        <p class="menu-label">Share</p>
        <button class="menu-item" data-act="witness" data-id="${v.id}">Send to witness</button>
        <button class="menu-item" data-act="ics" data-id="${v.id}">Add to calendar</button>
        <button class="menu-item danger" data-act="delete" data-id="${v.id}">Delete vow</button>
      </div>
    </details>
    </div>
  </article>`;
}

function vowStreak(v) {
  let n = 0;
  const done = v.occ.filter((o) => ["kept", "broken"].includes(o.status));
  for (let i = done.length - 1; i >= 0 && done[i].status === "kept"; i--) {
    n++;
  }
  return n;
}
function vowTrail(v) {
  const done = v.occ.filter((o) => o.status !== "open" && o.status !== "cancelled").slice(-14);
  if (v.kind !== "repeat" || !done.length) {
    return "";
  }
  const streak = vowStreak(v);
  return `<div class="row small"><div class="dots" aria-label="Last ${done.length} check-ins">${done.map((o) => `<span class="dot ${o.status}" title="${fmtWhen(o.due)}: ${o.status}"></span>`).join("")}</div>
    <span class="muted">${streak ? `${streak} in a row` : "Start a new streak today"}</span></div>`;
}

function viewHome() {
  const active = S.vows.filter((v) => v.status === "active");
  const st = stats();
  if (!S.vows.length) {
    return `${witnessSection()}<section class="empty stack">
      <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#seal"/></svg>
      <h1>Keep the promises you make to yourself.</h1>
      <p class="muted">Put money on it. Name a witness. If you don't show proof by the deadline, you pay your cause, not us.</p>
      <p><a class="btn primary" href="#new">Make your first vow</a></p>
      <p class="small muted">Free. No account. Everything stays on this device.</p>
    </section>`;
  }
  const byDue = active.slice().sort((a, b) => ((openOcc(a) || {}).due || Infinity) - ((openOcc(b) || {}).due || Infinity));
  const nextOcc = byDue.length ? openOcc(byDue[0]) : null;
  const owedTotal = S.debts.filter((d) => !d.paidAt).reduce((a, d) => a + d.amount, 0);
  return `<div class="hero row home-hero"><div><h1>Your vows</h1>

function recentCard() {

  return `<section class="recent" aria-labelledby="recent-h">

}

function heatmap() {
  const byDay = {};
  for (const v of S.vows) {
    for (const o of v.occ) {
      if (["kept", "broken", "excused"].includes(o.status)) {
        const k = dateKey(o.resolvedAt || o.due);
        const rank = { excused: 1, kept: 2, broken: 3 };
        if (!byDay[k] || rank[o.status] > rank[byDay[k]]) {
          byDay[k] = o.status;
        }
      }
    }
  }
  const today = new Date(now());
  today.setHours(12, 0, 0, 0);
  const start = new Date(today);
  start.setDate(start.getDate() - start.getDay() - 7 * 11);
  const cells = [];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const k = dateKey(d.getTime());
    cells.push(`<span class="${byDay[k] || ""} ${k === dateKey(today.getTime()) ? "today" : ""}" title="${k}${byDay[k] ? ": " + byDay[k] : ""}"></span>`);
  }
  return `<section class="card stack"><h2>Last 12 weeks</h2>
    <div class="heat" role="img" aria-label="Calendar of kept, broken and excused days over the last 12 weeks">${cells.join("")}</div>
    <ul class="legend-row small muted" aria-hidden="true"><li><i class="sw kept"></i>Kept</li><li><i class="sw broken"></i>Broken</li><li><i class="sw excused"></i>Excused</li><li><i class="sw"></i>No vow</li></ul></section>`;
}

}

async function confirmProof(id) {
  const w = loadWitnessing().find((x) => x.id === id);
  if (!w) {
    return;
  }
  const day = w.kind === "once" ? dateKey(w.due) : dateKey(now());
  openDialog(`<form class="stack" id="cf">
    <h2 id="dlg-title">Confirm proof</h2>
    <p class="muted small">Only confirm if you've actually seen proof that ${esc(w.n || "they")} did "${esc(w.t)}".</p>
    <label class="field"><span>Day</span><input type="date" id="cf-day" value="${day}"></label>
    <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><span class="spacer"></span><button class="btn primary">I saw it, sign</button></div>
    <textarea class="share-link" id="cf-link" aria-label="Confirmation link" readonly hidden></textarea>
    <div id="cf-qr"></div>
  </form>`, (d) => {
    $("#cf", d).addEventListener("submit", async (e) => {
      e.preventDefault();
      const chosen = $("#cf-day", d).value;
      const sig = await signProof(w.priv, w.id, chosen);
      const link = appUrl(`ok=${b64e(JSON.stringify({ id: w.id, d: chosen, sig }))}`);
      const box = $("#cf-link", d);
      box.value = link;
      box.hidden = false;
      $("#cf-qr", d).innerHTML = qrBlock(link, "Confirmation link");
      shareText(`I saw your proof for "${w.t}" (${chosen}). Open this to check in: ${link}`);
    });
  });
}

/* ---------- render + events ---------- */
function route() {
  const h = location.hash;
  if (h.startsWith("#invite=")) {
    return "invite";
  }
  if (h.startsWith("#bail=")) {
    return "bail";
  }
  if (h.startsWith("#paid=")) {
    return "paid";
  }
  if (h.startsWith("#accept=") || h.startsWith("#ok=") || h.startsWith("#bailok=") || h.startsWith("#paidok=")) {
    return "inbound";
  }
  return { "#new": "new", "#history": "history", "#settings": "settings" }[h] || "home";
}
function applyTheme() {
  const t = S.settings.theme === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : S.settings.theme;
  document.documentElement.dataset.theme = t;
}
let lastRoute = null;
function render() {
  const r = route();
  const view = $("#view");
  if (r === "new" && lastRoute === "new" && $("#newf")) {
    return; // keep the half-filled form
  }
  $$("nav.tabs a").forEach((a) => {
    if (a.dataset.route === r) {
      a.setAttribute("aria-current", "page");
    } else {
      a.removeAttribute("aria-current");
    }
  });
  if (r === "invite" || r === "inbound" || r === "bail" || r === "paid") {
    let payload;
    try {
      payload = JSON.parse(b64d(location.hash.slice(location.hash.indexOf("=") + 1)));
    } catch (err) {
      view.innerHTML = `<div class="hero"><h1>That link is broken</h1><p><a href="#">Go to Vow</a></p></div>`;
      return;
    }
    if (r === "inbound") {
      view.innerHTML = `<div class="hero"><h1>Checking…</h1></div>`;
      const h = location.hash;
      handleInbound(h.startsWith("#accept=") ? "accept" : h.startsWith("#bailok=") ? "bailok" : h.startsWith("#paidok=") ? "paidok" : "ok", payload);
      return;
    }
    if (r === "paid") {
      view.innerHTML = viewPaid(payload);
      const okBtn = $("#p-ok");
      if (okBtn) {
        okBtn.addEventListener("click", async () => {
          const w = loadWitnessing().find((x) => x.id === payload.id);
          if (!w) {
            return;
          }
          const sig = await signProof(w.priv, payload.id, `paid:${payload.debt}`);
          const link = appUrl(`paidok=${b64e(JSON.stringify({ id: payload.id, debt: payload.debt, sig }))}`);
          const box = $("#p-link");
          box.value = link;
          box.hidden = false;
          $("#p-qr").innerHTML = qrBlock(link, "Payment confirmation link");
          const send = $("#p-send");
          send.hidden = false;
          send.addEventListener("click", () => shareText(`I saw you pay for "${payload.t}". Open this to clear the debt: ${link}`));
          toast("Signed. Send the confirmation back.");
        });
      }
      return;
    }
    if (r === "bail") {
      view.innerHTML = viewBail(payload);
      const allow = $("#b-allow");
      if (allow) {
        allow.addEventListener("click", async () => {
          const w = loadWitnessing().find((x) => x.id === payload.id);
          if (!w) {
            return;
          }
          const sig = await signProof(w.priv, payload.id, "bail");
          const link = appUrl(`bailok=${b64e(JSON.stringify({ id: payload.id, sig }))}`);
          const box = $("#b-link");
          box.value = link;
          box.hidden = false;
          $("#b-qr").innerHTML = qrBlock(link, "Walk-away link");
          const send = $("#b-send");
          send.hidden = false;
          send.addEventListener("click", () => shareText(`I let you off "${payload.t}". Open this to close it out: ${link}`));
          toast("Signed. Send the walk-away back.");
        });
      }
      return;
    }
    view.innerHTML = viewInvite(payload);
    const accept = $("#w-accept");
    if (accept) {
      accept.addEventListener("click", async () => {
        const keys = await newWitnessKeys();
        const list = loadWitnessing().filter((w) => w.id !== payload.id);
        list.push({ ...payload, priv: keys.priv, pub: keys.pub, acceptedAt: now() });
        saveWitnessing(list);
        render();
        toast("You're the witness. Send the acceptance back.");
      });
    }
    const send = $("#w-send");
    if (send) {
      send.addEventListener("click", () => shareText(`I'll be your witness for "${payload.t}". Open this: ${$("#share-link").value}`));
    }
  } else {
    view.innerHTML = { home: viewHome, new: viewNew, history: viewHistory, settings: viewSettings }[r]();
    if (r === "new") {
      wireNew();
    }
    if (r === "settings") {
      wireSettings();
    }
  }
  if (lastRoute !== r) {
    window.scrollTo(0, 0);
  }
  lastRoute = r;
}

async function handleInbound(kind, p) {
  const v = S.vows.find((x) => x.id === p.id);
  const done = (msg) => {
    location.hash = "";
    render();
    toast(msg);
  };
  if (kind === "paidok") {
    const d = S.debts.find((x) => x.id === p.debt);
    if (!d || d.vowId !== p.id) {
      done("That payment link is for a debt that isn't on this device.");
      return;
    }
    const { pub, who } = debtWitness(d);
    if (!pub || !(await verifyProof(pub, p.id, `paid:${d.id}`, p.sig))) {
      done("That payment confirmation isn't signed by your witness.");
      return;
    }
    if (!d.paidAt) {
      d.paidAt = now();
      d.receipt = `confirmed by ${who}`;
      d.paidBy = "witness";
      save();
    }
    done(`Debt cleared. ${who} confirmed you paid.`);
    return;
  }
  if (!v) {
    done("That link belongs to a vow that isn't on this device.");
    return;
  }
  if (kind === "accept") {
    v.witnessPub = { x: p.x, y: p.y };
    v.sentAt = v.sentAt || now();
    save();
    done(`${v.witness || "Your witness"} accepted. Only they can confirm your proof now.`);
    return;
  }
  if (!v.witnessPub) {
    done("Your witness hasn't accepted yet, so this can't be checked.");
    return;
  }
  if (kind === "bailok") {
    const signed = await verifyProof(v.witnessPub, v.id, "bail", p.sig);
    if (!signed) {
      done("That walk-away isn't signed by your witness.");
      return;
    }
    // Idempotent: the signed walk-away may be opened (or the link re-fired) more than once —
    // schedule the delete exactly once.
    const already = (v.pending || []).some((pp) => pp.type === "delete" && pp.cost === "witness");
    if (!already) {
      v.bailoutSignedAt = now();
      delete v.bailoutAsked;
      schedule(v, "delete", null, "witness");
    }
    done(`Your witness let you off. "${v.title}" will be deleted in 24 hours.`);
    return;
  }
  const ok = await verifyProof(v.witnessPub, v.id, p.d, p.sig);
  const o = openOcc(v);
  if (!ok) {
    done("That confirmation isn't signed by your witness.");
    return;
  }
  if (!o || dateKey(o.due) !== p.d || o.opens > now() || (o.due < now() && !o.claim)) {
    done("Confirmed, but it doesn't match an open check-in for that day.");
    return;
  }
  o.status = "kept";
  o.resolvedAt = now();
  o.proof = { type: "witness", text: `Signed by ${v.witness || "witness"} for ${p.d}`, at: now() };
  save();
  tick();
  done(`Kept. ${v.witness || "Your witness"} confirmed it.`);
}

function wireNew() {

  }

function createVow(f) {
  const title = $("#f-title").value.trim();
  if (title.length < 3) {
    toast("Write what you'll do.");
    $("#f-title").focus();
    return;
  }
  if (!$("#f-witness").value.trim()) {
    toast("Name a witness. A vow nobody knows about is easy to break.");
    $("#f-witness").focus();
    return;
  }
  const t = now();
  const kind = f.kind.value;
  const stake = f.stake.value === "custom" ? Math.max(1, Math.round(Number($("#f-stake").value) || 0)) : Number(f.stake.value);
  const v = {
    id: uid(), title, kind, createdAt: t, status: "active", stake, baseStake: stake,
    escalate: $("#f-escalate").checked, to: $("#f-to").value.trim() || "a charity",
    proof: f.proof.value, timerMin: Math.max(1, Number($("#f-timer").value) || 25),
    witness: $("#f-witness").value.trim(), plan: $("#f-plan").value.trim(),
    sentAt: null, witnessPub: null, pending: [], occ: [],
  };
  if (kind === "once") {
    let due = f.when.value === "custom" ? new Date($("#f-when").value).getTime() : Number(f.when.value);
    if (!due || due <= t + 5 * MIN) {
      toast("Pick a deadline at least 5 minutes from now.");
      return;
    }
    v.occ.push({ id: uid(), opens: t, due, status: "open", stake });
  } else {
    v.days = $$("input[name=days]:checked", f).map((x) => Number(x.value));
    if (!v.days.length) {
      toast("Pick at least one day.");
      return;
    }
    v.time = $("#f-time").value || "21:00";
    const weeks = Number($("#f-until").value);
    v.until = weeks ? t + weeks * DAY : null;
  }
  S.vows.push(v);
  save();
  stamp();
  location.hash = "";
  tick();
  render();
  setTimeout(() => offerWitness(v, true), 650);
}
