<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vow - keep the promises you make to yourself</title>
<meta name="description" content="Free, private commitment contracts. Put a stake on a promise, name a witness, and pay your cause if you break it. No account, no subscription.">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120e" media="(prefers-color-scheme: dark)">

<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
:root {
  --bg: #f6f1e7;
  --card: #fffdf8;
  --ink: #1f1b16;
  --muted: #6b6257;
  --line: #e4dccd;
  --seal: #b42318;
  --seal-ink: #ffffff;
  --kept: #157f3b;
  --warn: #a15c07;
  --soft: #efe7d8;
  --shadow: 0 1px 2px rgba(31, 27, 22, .06), 0 8px 24px rgba(31, 27, 22, .06);
  --radius: 16px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-theme="dark"] {
  --bg: #15120e;
  --card: #201c17;
  --ink: #f2ebdd;
  --muted: #b3a895;
  --line: #3a332a;
  --seal: #f05a47;
  --seal-ink: #1a0f0c;
  --kept: #4cc477;
  --warn: #f0a640;
  --soft: #2a251e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.dot.kept { background: var(--kept); }
.dot.broken { background: var(--seal); }
.dot.excused { background: var(--warn); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, var(--card)); color: var(--warn); }
.story { font: 600 17px/1.5 var(--serif); }
.heat { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 4px; }
.heat span { border-radius: 3px; background: var(--soft); }
.heat .kept { background: var(--kept); }
.heat .broken { background: var(--seal); }
.heat .excused { background: var(--warn); }
.heat .today { outline: 2px solid var(--ink); outline-offset: -1px; }
.share-link { font-size: 12px; min-height: 64px; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }
header.top {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.brand svg { width: 34px; height: 34px; }
.brand b { font: 700 24px/1 var(--serif); letter-spacing: .5px; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs a {
  text-decoration: none; padding: 8px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 15px;
}
nav.tabs a[aria-current="page"] { background: var(--soft); color: var(--ink); }
h1, h2, h3 { font-family: var(--serif); line-height: 1.2; margin: 0; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px;
}
.stack > * + * { margin-top: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--card); border-radius: 12px;
  padding: 10px 16px; font-weight: 600; cursor: pointer; min-height: 44px; text-decoration: none;
  transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--seal); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--seal) 60%, transparent); outline-offset: 2px; }
.hero { padding: 28px 0 8px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat b { display: block; font: 700 24px/1.1 var(--serif); }
.stat span { font-size: 13px; color: var(--muted); }
.owed {
  border: 2px solid var(--seal); background: color-mix(in srgb, var(--seal) 8%, var(--card));
}
.vow-card { position: relative; overflow: hidden; }
.vow-card .title { font: 700 20px/1.25 var(--serif); margin: 0 0 4px; word-break: break-word; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: var(--soft); font-size: 13px; font-weight: 600;
}
.pill.stake { background: color-mix(in srgb, var(--seal) 14%, var(--card)); color: var(--seal); }
.pill.kept { background: color-mix(in srgb, var(--kept) 16%, var(--card)); color: var(--kept); }
.pill.broken { background: color-mix(in srgb, var(--seal) 16%, var(--card)); color: var(--seal); }
.pill.excused { background: color-mix(in srgb, var(--warn) 16%, var(--card)); color: var(--warn); }
.countdown { font: 700 28px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.countdown.soon { color: var(--seal); }
.pending { border-left: 3px solid var(--warn); padding: 6px 10px; background: var(--soft); border-radius: 8px; font-size: 14px; }
details.more summary { cursor: pointer; color: var(--muted); font-weight: 600; list-style: none; min-height: 44px; display: inline-flex; align-items: center; }
details.more summary::-webkit-details-marker { display: none; }
.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
label.field { display: block; }
label.field > span, .legend { display: block; font-weight: 700; margin-bottom: 6px; }
input[type=text], input[type=number], input[type=datetime-local], input[type=time], input[type=date], input[type=email], textarea, select {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  min-height: 46px;
}
textarea { min-height: 96px; resize: vertical; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label, .chips button {
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer;
  font-weight: 600; font-size: 15px; min-height: 40px; display: inline-flex; align-items: center;
}
.chips input:checked + span { color: var(--seal-ink); }
.chips label:has(input:checked) { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
.chips label:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--seal) 60%, transparent); }
.hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
.empty { text-align: center; padding: 40px 18px; }
.empty svg { width: 120px; height: 120px; }
.list { list-style: none; padding: 0; margin: 0; }
.list li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.cam video, .cam img { display: block; width: 100%; max-height: 300px; border-radius: 12px; object-fit: cover; background: var(--soft); }
.pay-alt { border-top: 1px solid var(--line, rgba(127,127,127,.25)); padding-top: 12px; }
.thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; background: var(--soft); }
dialog {
  border: 1px solid var(--line); border-radius: 20px; background: var(--card); color: var(--ink);
  padding: 22px; width: min(480px, calc(100vw - 24px)); box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
dialog::backdrop { background: rgba(20, 16, 12, .5); backdrop-filter: blur(2px); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600;
  max-width: calc(100vw - 32px); opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
.stamp-overlay {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 60; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
}
.stamp-overlay svg { width: 180px; height: 180px; animation: stamp .6s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: scale(2.4) rotate(-30deg); opacity: 0; } to { transform: scale(1) rotate(-8deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stamp-overlay svg { animation: none; } .btn { transition: none; } }
.rules { font-size: 14px; background: var(--soft); border-radius: 12px; padding: 12px 14px; }
.rules li { margin: 2px 0; }
.code { font: 700 40px/1 ui-monospace, Consolas, monospace; letter-spacing: 6px; text-align: center; padding: 16px; background: var(--soft); border-radius: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  h1 { font-size: 26px; }
  nav.tabs a { padding: 8px 9px; font-size: 14px; }
  .brand b { font-size: 21px; }
}
@media (max-width: 360px) {
  .brand b { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#" aria-label="Vow home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#seal"/></svg>
      <b>Vow</b>
    </a>
    <nav class="tabs" aria-label="Main">
      <a href="#" data-route="home">Vows</a>
      <a href="#history" data-route="history">History</a>
      <a href="#settings" data-route="settings">Settings</a>
    </nav>
  </div>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="seal" viewBox="0 0 64 64">
      <path fill="var(--seal)" d="M32 3l5 4 6-2 3 5 6 1 1 6 5 3-2 6 4 5-4 5 2 6-5 3-1 6-6 1-3 5-6-2-5 4-5-4-6 2-3-5-6-1-1-6-5-3 2-6-4-5 4-5-2-6 5-3 1-6 6-1 3-5 6 2z"/>
      <circle cx="32" cy="32" r="17" fill="none" stroke="var(--seal-ink)" stroke-width="2.5" opacity=".9"/>
      <path d="M24 26l8 14 8-14" fill="none" stroke="var(--seal-ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<main class="wrap" id="view" tabindex="-1"></main>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const KEY = "vow.v1";
const MIN = 60e3;
const HOUR = 60 * MIN;
const DAY = 24 * HOUR;
const LOCK = 24 * HOUR;
const FREE_EDIT = 10 * MIN;
const PASS_WINDOW = 30 * DAY;
const DEBT_GRACE = 7 * DAY;
const FAR_OFF = 3 * DAY;
const ESCALATE_FACTOR = 1.5;
const ESCALATE_CAP = 4;
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const ICS_DAYS = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 10) + now().toString(36).slice(-4);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function blankState() {
  return { version: 1, settings: { currency: "$", theme: "auto", name: "" }, vows: [], debts: [], passes: [] };
}
function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) {
      return blankState();
    }
    const data = JSON.parse(raw);
    const base = blankState();
    return { ...base, ...data, settings: { ...base.settings, ...(data.settings || {}) } };
  } catch (err) {
    return blankState();
  }
}
let S = loadState();
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (err) {
    toast("Storage is full. Export a backup in Settings.");
  }
}

/* ---------- formatting ---------- */
const money = (n) => `${S.settings.currency}${Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
function fmtWhen(ms) {
  return new Date(ms).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function fmtLeft(ms) {
  if (ms <= 0) {
    return "0m";
  }
  const d = Math.floor(ms / DAY);
  const h = Math.floor((ms % DAY) / HOUR);
  const m = Math.floor((ms % HOUR) / MIN);
  const s = Math.floor((ms % MIN) / 1000);
  if (d > 0) {
    return `${d}d ${h}h`;
  }
  if (h > 0) {
    return `${h}h ${String(m).padStart(2, "0")}m`;
  }
  return `${m}m ${String(s).padStart(2, "0")}s`;
}
function dateKey(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function toLocalInput(ms) {
  const d = new Date(ms);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function scheduleText(v) {
  if (v.kind === "once") {
    return `by ${fmtWhen(v.occ[0].due)}`;
  }
  const days = v.days.length === 7 ? "every day" : v.days.map((d) => DAY_NAMES[d]).join(", ");
  const until = v.until ? ` until ${new Date(v.until).toLocaleDateString(undefined, { day: "numeric", month: "short" })}` : "";
  return `${days} by ${v.time}${until}`;
}
const proofLabel = { photo: "Photo", note: "Written note", timer: "Focus timer", witness: "Witness code" };

/* ---------- schedule engine ---------- */
function nextDue(v, after) {
  const [h, m] = v.time.split(":").map(Number);
  const d = new Date(after);
  d.setHours(h, m, 0, 0);
  for (let i = 0; i < 15; i++) {
    if (d.getTime() > after && v.days.includes(d.getDay())) {
      return d.getTime();
    }
    d.setDate(d.getDate() + 1);
    d.setHours(h, m, 0, 0);
  }
  return null;
}
const openOcc = (v) => v.occ.find((o) => o.status === "open");
const freeEdit = (v) => now() - v.createdAt < FREE_EDIT;
// A vow is "far-off" when its next check-in is more than FAR_OFF away. Bailing out of one
// then isn't free: you owe the stake, or your witness has to sign you off.
function isFarOff(v) {
  const o = openOcc(v);
  return !!o && o.due - now() > FAR_OFF;
}

function addDebt(v, o) {
  const debt = { id: uid(), vowId: v.id, occId: o.id, title: v.title, amount: o.stake, to: v.to, at: o.due, paidAt: null, receipt: "",
    witness: v.witness || "", witnessPub: v.witnessPub || null };
  S.debts.push(debt);
  return debt;
}

function applyPending(v, p) {
  const open = openOcc(v);
  if (p.type === "lower") {
    v.stake = p.value;
    v.baseStake = Math.min(v.baseStake, p.value);
    if (open) {
      open.stake = p.value;
    }
  } else if (p.type === "push" && open) {
    open.due = p.value;
  } else if (p.type === "delete") {
    v.status = "deleted";
    if (open) {
      open.status = "cancelled";
    }
  }
}

function tick() {
  const t = now();
  const broken = [];
  let changed = false;
  for (const v of S.vows) {
    if (v.status !== "active") {
      continue;
    }
    const due = (v.pending || []).filter((p) => p.at <= t).sort((a, b) => a.at - b.at);
    for (const p of due) {
      // a deadline that passed before the change took effect still counts
      const open = openOcc(v);
      if (open && open.due <= p.at) {
        break;
      }
      applyPending(v, p);
      v.pending = v.pending.filter((x) => x !== p);
      changed = true;
    }
    let guard = 0;
    while (v.status === "active" && guard++ < 200) {
      let o = openOcc(v);
      if (!o) {
        if (v.kind !== "repeat") {
          v.status = "done";
          changed = true;
          break;
        }
        const last = v.occ[v.occ.length - 1];
        const dueAt = nextDue(v, last ? last.due : v.createdAt + 30 * MIN);
        if (dueAt === null || (v.until && dueAt > v.until)) {
          v.status = "done";
          changed = true;
          break;
        }
        o = { id: uid(), opens: last ? last.due : v.createdAt, due: dueAt, status: "open", stake: v.stake };
        v.occ.push(o);
        changed = true;
      }
      if (o.due + (o.claim ? DAY : 0) > t) {
        break;
      }
      o.status = "broken";
      o.resolvedAt = o.due;
      broken.push({ v, debt: addDebt(v, o) });
      if (v.escalate) {
        v.stake = Math.min(Math.ceil(v.stake * ESCALATE_FACTOR), v.baseStake * ESCALATE_CAP);
      }
      // pending changes that were waiting on this deadline now apply to the next one
      for (const p of (v.pending || []).filter((p) => p.at <= t)) {
        applyPending(v, p);
        v.pending = v.pending.filter((x) => x !== p);
      }
      changed = true;
    }
  }
  if (changed) {
    save();
    render();
  }
  if (broken.length) {
    confess(broken);
  }
}

/* ---------- witness codes ---------- */
const b64e = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)));
const ECDSA = { name: "ECDSA", namedCurve: "P-256" };
const bytesB64u = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64uBytes = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
const appUrl = (hash) => `${location.origin}${location.pathname}#${hash}`;
const proofMessage = (id, day) => new TextEncoder().encode(`vow:${id}:${day}`);

// The witness's private key is created and kept on the witness's device only.
async function newWitnessKeys() {
  const pair = await crypto.subtle.generateKey(ECDSA, true, ["sign", "verify"]);
  const priv = await crypto.subtle.exportKey("jwk", pair.privateKey);
  const pub = await crypto.subtle.exportKey("jwk", pair.publicKey);
  return { priv, pub: { x: pub.x, y: pub.y } };
}
async function signProof(priv, id, day) {
  const key = await crypto.subtle.importKey("jwk", priv, ECDSA, false, ["sign"]);
  const sig = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, key, proofMessage(id, day));
  return bytesB64u(new Uint8Array(sig));
}
async function verifyProof(pub, id, day, sig) {
  try {
    const key = await crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", x: pub.x, y: pub.y, ext: true }, ECDSA, false, ["verify"]);
    return await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, key, b64uBytes(sig), proofMessage(id, day));
  } catch (err) {
    return false;
  }
}
function invitePayload(v) {
  return {
    id: v.id, t: v.title, n: S.settings.name || "", kind: v.kind, to: v.to, s: money(v.stake),
    due: v.kind === "once" ? v.occ[0].due : null, days: v.days || null, time: v.time || null,
  };
}
function witnessLink(v) {
  return appUrl(`invite=${b64e(JSON.stringify(invitePayload(v)))}`);
}
const WKEY = "vow.witnessing";
function loadWitnessing() {
  try {
    return JSON.parse(localStorage.getItem(WKEY) || "[]");
  } catch (err) {
    return [];
  }
}
function saveWitnessing(list) {
  localStorage.setItem(WKEY, JSON.stringify(list));
}

/* ---------- helpers ---------- */
let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function shareText(text) {
  if (navigator.share) {
    try {
      await navigator.share({ text });
      return;
    } catch (err) {
      if (err && err.name === "AbortError") {
        return;
      }
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied. Paste it to your witness.");
  } catch (err) {
    toast("Select and copy the message above.");
  }
}

function stats() {
  const all = S.vows.flatMap((v) => v.occ);
  const kept = all.filter((o) => o.status === "kept");
  const broken = all.filter((o) => o.status === "broken");
  const resolved = all.filter((o) => ["kept", "broken"].includes(o.status)).sort((a, b) => b.resolvedAt - a.resolvedAt);
  let streak = 0;
  for (const o of resolved) {
    if (o.status !== "kept") {
      break;
    }
    streak++;
  }
  const owed = S.debts.filter((d) => !d.paidAt).reduce((a, d) => a + d.amount, 0);
  const paid = S.debts.filter((d) => d.paidAt).reduce((a, d) => a + d.amount, 0);
  const rate = resolved.length ? Math.round((kept.length / resolved.length) * 100) : null;
  let best = 0;
  let run = 0;
  for (const o of resolved.slice().reverse()) {
    run = o.status === "kept" ? run + 1 : 0;
    best = Math.max(best, run);
  }
  const monthStart = new Date(now());
  monthStart.setDate(1);
  monthStart.setHours(0, 0, 0, 0);
  const month = all.filter((o) => (o.resolvedAt || 0) >= monthStart.getTime());
  return {
    kept: kept.length, broken: broken.length, streak, best, owed, paid, rate, saved: kept.reduce((a, o) => a + o.stake, 0),
    month: { kept: month.filter((o) => o.status === "kept").length, broken: month.filter((o) => o.status === "broken").length, excused: month.filter((o) => o.status === "excused").length },
  };
}

function heatmap() {
  const byDay = {};
  for (const v of S.vows) {
    for (const o of v.occ) {
      if (["kept", "broken", "excused"].includes(o.status)) {
        const k = dateKey(o.resolvedAt || o.due);
        const rank = { excused: 1, kept: 2, broken: 3 };
        if (!byDay[k] || rank[o.status] > rank[byDay[k]]) {
          byDay[k] = o.status;
        }
      }
    }
  }
  const today = new Date(now());
  today.setHours(12, 0, 0, 0);
  const start = new Date(today);
  start.setDate(start.getDate() - start.getDay() - 7 * 11);
  const cells = [];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const k = dateKey(d.getTime());
    cells.push(`<span class="${byDay[k] || ""} ${k === dateKey(today.getTime()) ? "today" : ""}" title="${k}${byDay[k] ? ": " + byDay[k] : ""}"></span>`);
  }
  return `<section class="card stack"><h2>Last 12 weeks</h2>
    <div class="heat" role="img" aria-label="Calendar of kept, broken and excused days over the last 12 weeks">${cells.join("")}</div>
    <p class="small muted">Green kept · red broken · amber excused</p></section>`;
}

/* ---------- render + events ---------- */
function route() {
  const h = location.hash;
  if (h.startsWith("#invite=")) {
    return "invite";
  }
  if (h.startsWith("#bail=")) {
    return "bail";
  }
  if (h.startsWith("#paid=")) {
    return "paid";
  }
  if (h.startsWith("#accept=") || h.startsWith("#ok=") || h.startsWith("#bailok=") || h.startsWith("#paidok=")) {
    return "inbound";
  }
  return { "#new": "new", "#history": "history", "#settings": "settings" }[h] || "home";
}
function applyTheme() {
  const t = S.settings.theme === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : S.settings.theme;
  document.documentElement.dataset.theme = t;
}
let lastRoute = null;
function render() {
  const r = route();
  const view = $("#view");
  if (r === "new" && lastRoute === "new" && $("#newf")) {
    return; // keep the half-filled form
  }
  $$("nav.tabs a").forEach((a) => {
    if (a.dataset.route === r) {
      a.setAttribute("aria-current", "page");
    } else {
      a.removeAttribute("aria-current");
    }
  });
  if (r === "invite" || r === "inbound" || r === "bail" || r === "paid") {
    let payload;
    try {
      payload = JSON.parse(b64d(location.hash.slice(location.hash.indexOf("=") + 1)));
    } catch (err) {
      view.innerHTML = `<div class="hero"><h1>That link is broken</h1><p><a href="#">Go to Vow</a></p></div>`;
      return;
    }
    if (r === "inbound") {
      view.innerHTML = `<div class="hero"><h1>Checking…</h1></div>`;
      const h = location.hash;
      handleInbound(h.startsWith("#accept=") ? "accept" : h.startsWith("#bailok=") ? "bailok" : h.startsWith("#paidok=") ? "paidok" : "ok", payload);
      return;
    }
    if (r === "paid") {
      view.innerHTML = viewPaid(payload);
      const okBtn = $("#p-ok");
      if (okBtn) {
        okBtn.addEventListener("click", async () => {
          const w = loadWitnessing().find((x) => x.id === payload.id);
          if (!w) {
            return;
          }
          const sig = await signProof(w.priv, payload.id, `paid:${payload.debt}`);
          const link = appUrl(`paidok=${b64e(JSON.stringify({ id: payload.id, debt: payload.debt, sig }))}`);
          const box = $("#p-link");
          box.value = link;
          box.hidden = false;
          const send = $("#p-send");
          send.hidden = false;
          send.addEventListener("click", () => shareText(`I saw you pay for "${payload.t}". Open this to clear the debt: ${link}`));
          toast("Signed. Send the confirmation back.");
        });
      }
      return;
    }
    if (r === "bail") {
      view.innerHTML = viewBail(payload);
      const allow = $("#b-allow");
      if (allow) {
        allow.addEventListener("click", async () => {
          const w = loadWitnessing().find((x) => x.id === payload.id);
          if (!w) {
            return;
          }
          const sig = await signProof(w.priv, payload.id, "bail");
          const link = appUrl(`bailok=${b64e(JSON.stringify({ id: payload.id, sig }))}`);
          const box = $("#b-link");
          box.value = link;
          box.hidden = false;
          const send = $("#b-send");
          send.hidden = false;
          send.addEventListener("click", () => shareText(`I let you off "${payload.t}". Open this to close it out: ${link}`));
          toast("Signed. Send the walk-away back.");
        });
      }
      return;
    }
    view.innerHTML = viewInvite(payload);
    const accept = $("#w-accept");
    if (accept) {
      accept.addEventListener("click", async () => {
        const keys = await newWitnessKeys();
        const list = loadWitnessing().filter((w) => w.id !== payload.id);
        list.push({ ...payload, priv: keys.priv, pub: keys.pub, acceptedAt: now() });
        saveWitnessing(list);
        render();
        toast("You're the witness. Send the acceptance back.");
      });
    }
    const send = $("#w-send");
    if (send) {
      send.addEventListener("click", () => shareText(`I'll be your witness for "${payload.t}". Open this: ${$("#share-link").value}`));
    }
  } else {
    view.innerHTML = { home: viewHome, new: viewNew, history: viewHistory, settings: viewSettings }[r]();
    if (r === "new") {
      wireNew();
    }
    if (r === "settings") {
      wireSettings();
    }
  }
  if (lastRoute !== r) {
    window.scrollTo(0, 0);
  }
  lastRoute = r;
}

async function handleInbound(kind, p) {
  const v = S.vows.find((x) => x.id === p.id);
  const done = (msg) => {
    location.hash = "";
    render();
    toast(msg);
  };
  if (kind === "paidok") {
    const d = S.debts.find((x) => x.id === p.debt);
    if (!d || d.vowId !== p.id) {
      done("That payment link is for a debt that isn't on this device.");
      return;
    }
    const { pub, who } = debtWitness(d);
    if (!pub || !(await verifyProof(pub, p.id, `paid:${d.id}`, p.sig))) {
      done("That payment confirmation isn't signed by your witness.");
      return;
    }
    if (!d.paidAt) {
      d.paidAt = now();
      d.receipt = `confirmed by ${who}`;
      d.paidBy = "witness";
      save();
    }
    done(`Debt cleared. ${who} confirmed you paid.`);
    return;
  }
  if (!v) {
    done("That link belongs to a vow that isn't on this device.");
    return;
  }
  if (kind === "accept") {
    v.witnessPub = { x: p.x, y: p.y };
    v.sentAt = v.sentAt || now();
    save();
    done(`${v.witness || "Your witness"} accepted. Only they can confirm your proof now.`);
    return;
  }
  if (!v.witnessPub) {
    done("Your witness hasn't accepted yet, so this can't be checked.");
    return;
  }
  if (kind === "bailok") {
    const signed = await verifyProof(v.witnessPub, v.id, "bail", p.sig);
    if (!signed) {
      done("That walk-away isn't signed by your witness.");
      return;
    }
    // Idempotent: the signed walk-away may be opened (or the link re-fired) more than once —
    // schedule the delete exactly once.
    const already = (v.pending || []).some((pp) => pp.type === "delete" && pp.cost === "witness");
    if (!already) {
      v.bailoutSignedAt = now();
      delete v.bailoutAsked;
      schedule(v, "delete", null, "witness");
    }
    done(`Your witness let you off. "${v.title}" will be deleted in 24 hours.`);
    return;
  }
  const ok = await verifyProof(v.witnessPub, v.id, p.d, p.sig);
  const o = openOcc(v);
  if (!ok) {
    done("That confirmation isn't signed by your witness.");
    return;
  }
  if (!o || dateKey(o.due) !== p.d || o.opens > now() || (o.due < now() && !o.claim)) {
    done("Confirmed, but it doesn't match an open check-in for that day.");
    return;
  }
  o.status = "kept";
  o.resolvedAt = now();
  o.proof = { type: "witness", text: `Signed by ${v.witness || "witness"} for ${p.d}`, at: now() };
  save();
  tick();
  done(`Kept. ${v.witness || "Your witness"} confirmed it.`);
}

function createVow(f) {
  const title = $("#f-title").value.trim();
  if (title.length < 3) {
    toast("Write what you'll do.");
    $("#f-title").focus();
    return;
  }
  if (!$("#f-witness").value.trim()) {
    toast("Name a witness. A vow nobody knows about is easy to break.");
    $("#f-witness").focus();
    return;
  }
  const t = now();
  const kind = f.kind.value;
  const stake = f.stake.value === "custom" ? Math.max(1, Math.round(Number($("#f-stake").value) || 0)) : Number(f.stake.value);
  const v = {
    id: uid(), title, kind, createdAt: t, status: "active", stake, baseStake: stake,
    escalate: $("#f-escalate").checked, to: $("#f-to").value.trim() || "a charity",
    proof: f.proof.value, timerMin: Math.max(1, Number($("#f-timer").value) || 25),
    witness: $("#f-witness").value.trim(), plan: $("#f-plan").value.trim(),
    sentAt: null, witnessPub: null, pending: [], occ: [],
  };
  if (kind === "once") {
    let due = f.when.value === "custom" ? new Date($("#f-when").value).getTime() : Number(f.when.value);
    if (!due || due <= t + 5 * MIN) {
      toast("Pick a deadline at least 5 minutes from now.");
      return;
    }
    v.occ.push({ id: uid(), opens: t, due, status: "open", stake });
  } else {
    v.days = $$("input[name=days]:checked", f).map((x) => Number(x.value));
    if (!v.days.length) {
      toast("Pick at least one day.");
      return;
    }
    v.time = $("#f-time").value || "21:00";
    const weeks = Number($("#f-until").value);
    v.until = weeks ? t + weeks * DAY : null;
  }
  S.vows.push(v);
  save();
  stamp();
  location.hash = "";
  tick();
  render();
  setTimeout(() => offerWitness(v, true), 650);
}

// Scale to 640 px and burn in a time stamp, so a proof image can't be passed off as another day's.
function stampImage(source, width, height, label) {
  const max = 640;
  const sc = Math.min(1, max / Math.max(width, height));
  const c = document.createElement("canvas");
  c.width = Math.round(width * sc);
  c.height = Math.round(height * sc);
  const g = c.getContext("2d");
  g.drawImage(source, 0, 0, c.width, c.height);
  g.font = "bold 16px system-ui, sans-serif";
  const w = g.measureText(label).width + 16;
  g.fillStyle = "rgba(0,0,0,.6)";
  g.fillRect(8, c.height - 34, w, 26);
  g.fillStyle = "#fff";
  g.fillText(label, 16, c.height - 15);
  return c.toDataURL("image/jpeg", 0.7);
}

function compressPhoto(file, prefix = "Vow") {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(stampImage(img, img.width, img.height, `${prefix} · ${fmtWhen(now())}`));
    };
    img.onerror = reject;
    img.src = url;
  });
}

// Photo proof is a live camera shot taken inside Vow: no gallery, no old pictures.
async function startCamera(video) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("no camera");
  }
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
  video.srcObject = stream;
  await video.play();
  return stream;
}
function stopCamera(stream) {
  if (stream) {
    stream.getTracks().forEach((t) => t.stop());
  }
}

function keep(v, o, proof) {
  if (v.witnessPub && proof.type !== "witness") {
    o.claim = proof;
    o.claimedAt = now();
    save();
    dlg.close();
    render();
    const msg = `Proof for "${v.title}" (${dateKey(o.due)}): ${proof.text || "photo attached in Vow"}. Please confirm in Vow if it's real.`;
    tellWitness(`Sent to ${v.witness} for confirmation`, v, msg);
    toast(`${v.witness} has 24 h after the deadline to confirm.`);
    return;
  }
  o.status = "kept";
  o.resolvedAt = now();
  o.proof = proof;
  save();
  dlg.close();
  stamp(getComputedStyle(document.documentElement).getPropertyValue("--kept"));
  tick();
  render();
  const st = stats();
  const milestone = [3, 5, 10, 25, 50, 100].includes(st.streak);
  toast(milestone ? `${st.streak} in a row. ${money(st.saved)} kept safe so far.` : `Kept. ${money(o.stake)} stays with you.`);
}

function checkIn(v) {
  const o = openOcc(v);
  if (!o) {
    return;
  }
  const head = `<h2 id="dlg-title">Check in</h2><p class="muted small">"${esc(v.title)}"${v.witnessPub && v.proof !== "witness" ? ` · ${esc(v.witness)} confirms this before it counts` : ""}</p>`;
  const foot = (label) => `<div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><span class="spacer"></span><button class="btn primary" id="ok">${label}</button></div>`;
  if (v.proof === "note") {
    openDialog(`<form class="stack" id="pf">${head}
      <label class="field"><span>What exactly did you do?</span><textarea id="pnote" minlength="15" required placeholder="Ran 5.2 km along the coast, 31 minutes"></textarea></label>
      <p class="hint">At least 15 characters. Be specific, your witness may ask.</p>${foot("Submit proof")}</form>`, (d) => {
      $("#pf", d).addEventListener("submit", (e) => {
        e.preventDefault();
        const text = $("#pnote", d).value.trim();
        if (text.length < 15) {
          toast("Add a bit more detail (15+ characters).");
          return;
        }
        keep(v, o, { type: "note", text, at: now() });
      });
    });
  } else if (v.proof === "photo") {
    openDialog(`<form class="stack" id="pf">${head}
      <div class="cam"><video id="pvideo" playsinline muted aria-label="Camera preview"></video>
        <img id="pprev" alt="Photo you took" hidden></div>
      <p class="hint" id="pcam-hint">Point your camera at it and take the photo now. Only a live shot counts, not a picture from your gallery. It's stamped with the time and stays on this device.</p>
      <div class="row"><button type="button" class="btn" id="psnap" disabled>Take photo</button>
        <button type="button" class="btn ghost" id="pretake" hidden>Retake</button></div>${foot("Submit proof")}</form>`, (d) => {
      let data = null;
      let stream = null;
      const video = $("#pvideo", d);
      const snap = $("#psnap", d);
      const retake = $("#pretake", d);
      const prev = $("#pprev", d);
      dlg.addEventListener("close", () => stopCamera(stream), { once: true });
      startCamera(video).then((s) => {
        stream = s;
        snap.disabled = false;
      }).catch(() => {
        video.hidden = true;
        $("#pcam-hint", d).textContent = "Vow can't open a camera here. Allow camera access, or check in from your phone: photo proof only takes a live camera shot.";
      });
      snap.addEventListener("click", () => {
        if (!video.videoWidth) {
          return;
        }
        data = stampImage(video, video.videoWidth, video.videoHeight, `Vow · ${fmtWhen(now())}`);
        prev.src = data;
        prev.hidden = false;
        video.hidden = true;
        snap.hidden = true;
        retake.hidden = false;
      });
      retake.addEventListener("click", () => {
        data = null;
        prev.hidden = true;
        video.hidden = false;
        snap.hidden = false;
        retake.hidden = true;
      });
      $("#pf", d).addEventListener("submit", (e) => {
        e.preventDefault();
        if (!data) {
          toast("Take the photo first.");
          return;
        }
        stopCamera(stream);
        keep(v, o, { type: "photo", photo: data, live: true, at: now() });
      });
    });
  } else if (v.proof === "witness") {
    const who = esc(v.witness || "your witness");
    const msg = `Can you confirm my vow "${v.title}" for ${dateKey(o.due)}? Open Vow, tap Confirm proof, and send me the link.`;
    openDialog(`<div class="stack">${head}
      ${v.witnessPub
        ? `<p>Show ${who} your proof. They tap <b>Confirm proof</b> in their Vow and send you a link. Opening that link checks you in.</p>`
        : `<p>${who} hasn't accepted yet. Until they do, nobody can confirm this vow.</p>`}
      <p class="hint">Only ${who}'s phone holds the key that signs confirmations. You can't make one yourself.</p>
      <div class="row"><button class="btn ghost" data-close>Close</button><span class="spacer"></span>
        <button class="btn primary" id="ask">${v.witnessPub ? `Ask ${who}` : "Send invite again"}</button></div></div>`, (d) => {
      $("#ask", d).addEventListener("click", () => (v.witnessPub ? shareText(msg) : offerWitness(v, false)));
    });
  } else {
    let left = v.timerMin * 60;
    let timer = null;
    openDialog(`<div class="stack">${head}
      <div class="code" id="tleft" aria-live="off">${String(v.timerMin).padStart(2, "0")}:00</div>
      <p class="hint">Counts only while Vow is open on screen. Leave and it pauses.</p>
      <div class="row"><button class="btn ghost" data-close>Stop</button><span class="spacer"></span><button class="btn primary" id="tstart">Start focus</button></div></div>`, (d) => {
      const show = () => {
        $("#tleft", d).textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
      };
      $("#tstart", d).addEventListener("click", (e) => {
        e.target.disabled = true;
        e.target.textContent = "Focusing…";
        timer = setInterval(() => {
          if (document.visibilityState !== "visible") {
            return;
          }
          left--;
          show();
          if (left <= 0) {
            clearInterval(timer);
            keep(v, o, { type: "timer", text: `${v.timerMin} min focus`, at: now() });
          }
        }, 1000);
      });
      d.addEventListener("close", () => clearInterval(timer), { once: true });
    });
  }
}

function schedule(v, type, value, cost) {
  v.pending = v.pending || [];
  const p = { id: uid(), type, value, at: now() + LOCK };
  if (cost) {
    p.cost = cost;
  }
  v.pending.push(p);
  save();
  render();
  toast("Scheduled. It applies in 24 hours.");
  return p;
}

function bailPayload(v) {
  const o = openOcc(v);
  return { id: v.id, t: v.title, n: S.settings.name || "", to: v.to, s: money(v.stake), left: o ? fmtLeft(o.due - now()) : "" };
}
function bailLink(v) {
  return appUrl(`bail=${b64e(JSON.stringify(bailPayload(v)))}`);
}
function offerBail(v) {
  openDialog(`<div class="stack">
    <h2 id="dlg-title">Ask ${esc(v.witness)} to let you off</h2>
    <p class="muted small">This vow is still far out, so it can't be deleted for free. Only ${esc(v.witness)} can sign a walk-away.</p>
    <textarea id="bmsg" aria-label="Walk-away request" readonly>${esc(bailLink(v))}</textarea>
    <div class="row"><button class="btn ghost" data-close>Not now</button><span class="spacer"></span><button class="btn primary" id="bmsend">Send walk-away request</button></div>
  </div>`, (d) => {
    $("#bmsend", d).addEventListener("click", () => shareText(`I want to walk away from "${v.title}" before the deadline. Please sign off: ${bailLink(v)}`));
  });
}
function walkAway(v) {
  const canAsk = !!v.witnessPub;
  openDialog(`<form class="stack" id="wf">
    <h2 id="dlg-title">Walk away?</h2>
    <p class="muted small">This vow is still far out, so bailing isn't free. Pick how you exit:</p>
    <button type="button" class="btn block" id="w-debt">Owe ${money(v.stake)} to ${esc(v.to)}</button>
    ${canAsk
      ? `<button type="button" class="btn block" id="w-ask">Ask ${esc(v.witness)} to let me off</button>`
      : `<p class="small muted">Your witness hasn't accepted yet, so only the debt option is open.</p>`}
    <p class="small muted row" style="margin:0"><button type="button" class="btn ghost" data-close>Keep the vow</button></p>
  </form>`, (d) => {
    $("#w-debt", d).addEventListener("click", () => {
      dlg.close();
      const p = schedule(v, "delete", null, "debt");
      S.debts.push({ id: uid(), vowId: v.id, occId: null, title: v.title, amount: v.stake, to: v.to, at: now(), paidAt: null, receipt: "", bailout: p.id,
        witness: v.witness || "", witnessPub: v.witnessPub || null });
      save();
      render();
      tellWitness("Walk-away — I owe", v, `I'm walking away from "${v.title}" and owe you ${money(v.stake)} for it. It applies in 24 hours; if I cancel before then, the debt is refunded.`);
    });
    if (canAsk) {
      $("#w-ask", d).addEventListener("click", () => {
        dlg.close();
        v.bailoutAsked = now();
        save();
        render();
        offerBail(v);
      });
    }
  });
}

function icsFor(v) {
  const pad = (n) => String(n).padStart(2, "0");
  const local = (ms) => {
    const d = new Date(ms);
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  };
  const icsEsc = (s) => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const o = openOcc(v) || v.occ[v.occ.length - 1];
  const start = o.due - 30 * MIN;
  const stampUtc = new Date(now()).toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Vow//Commitments//EN", "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT", `UID:${v.id}@vow`, `DTSTAMP:${stampUtc}`, `DTSTART:${local(start)}`, "DURATION:PT30M",
    `SUMMARY:${icsEsc(`Vow: ${v.title} (${money(v.stake)} at stake)`)}`,
    `DESCRIPTION:${icsEsc(`Deadline. Check in on Vow with proof or pay ${money(v.stake)} to ${v.to}.`)}`,
  ];
  if (v.kind === "repeat") {
    const until = v.until ? `;UNTIL=${local(v.until)}` : "";
    lines.push(`RRULE:FREQ=WEEKLY;BYDAY=${v.days.map((d) => ICS_DAYS[d]).join(",")}${until}`);
  }
  lines.push("BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-PT1H", `DESCRIPTION:${icsEsc(`Vow due soon: ${v.title}`)}`, "END:VALARM", "END:VEVENT", "END:VCALENDAR");
  return lines.join("\r\n") + "\r\n";
}

async function act(kind, v) {
  const o = openOcc(v);
  if (kind === "raise") {
    const val = await ask({ title: "Raise the stake", label: `New stake (now ${money(v.stake)})`, type: "number", value: v.stake * 2, min: v.stake + 1, ok: "Raise now" });
    const n = Math.round(Number(val));
    if (val === null) {
      return;
    }
    if (!(n > v.stake)) {
      toast("Raising means a bigger number.");
      return;
    }
    v.stake = n;
    v.baseStake = Math.max(v.baseStake, n);
    if (o) {
      o.stake = n;
    }
    save();
    render();
    toast(`Stake raised to ${money(n)}.`);
  } else if (kind === "lower") {
    const val = await ask({ title: "Lower the stake", body: "This waits 24 hours. A deadline before then still counts at the current stake.", label: `New stake (now ${money(v.stake)})`, type: "number", value: Math.max(1, Math.floor(v.stake / 2)), min: 1, ok: "Schedule" });
    const n = Math.round(Number(val));
    if (val === null) {
      return;
    }
    if (!(n >= 1 && n < v.stake)) {
      toast("Pick a smaller amount, at least 1.");
      return;
    }
    schedule(v, "lower", n);
  } else if (kind === "push") {
    const val = await ask({ title: "Push the deadline", body: "This waits 24 hours. If the current deadline comes first, it still counts.", label: "New deadline", type: "datetime-local", value: toLocalInput(o.due + DAY), ok: "Schedule" });
    if (val === null) {
      return;
    }
    const ms = new Date(val).getTime();
    if (!(ms > o.due)) {
      toast("Pick a later time than the current deadline.");
      return;
    }
    schedule(v, "push", ms);
  } else if (kind === "delete") {
    if (isFarOff(v)) {
      walkAway(v);
      return;
    }
    const val = await ask({ title: "Delete this vow?", body: "Deleting waits 24 hours, and any deadline before then still counts. Debts you already owe stay.", label: "Type DELETE to confirm", ok: "Schedule delete" });
    if (val === null) {
      return;
    }
    if (val.trim().toUpperCase() !== "DELETE") {
      toast("Not deleted.");
      return;
    }
    schedule(v, "delete", null);
  } else if (kind === "pass") {
    const last = S.passes.filter((p) => now() - p.at < PASS_WINDOW).sort((a, b) => b.at - a.at)[0];
    if (last) {
      toast(`Your next pass is available ${fmtWhen(last.at + PASS_WINDOW)}.`);
      return;
    }
    if (!o || o.due <= now()) {
      toast("Passes only work before the deadline.");
      return;
    }
    const val = await ask({ title: "Life happens pass", body: "One per 30 days, only before the deadline. This check-in is excused and your witness should know why.", label: "What happened?", ok: "Use my pass" });
    if (val === null) {
      return;
    }
    if (val.trim().length < 5) {
      toast("Say what happened (5+ characters).");
      return;
    }
    o.status = "excused";
    o.resolvedAt = now();
    o.reason = val.trim();
    S.passes.push({ at: now(), vowId: v.id });
    save();
    tick();
    render();
    tellWitness("Pass used", v, `I used my one "life happens" pass this month on "${v.title}": ${o.reason}.`);
  } else if (kind === "reword") {
    if (!freeEdit(v)) {
      toast("The wording is sealed now.");
      return;
    }
    const val = await ask({ title: "Fix the wording", body: "Only the words change. Stake, deadline and witness stay sealed.", label: "I will…", value: v.title, ok: "Save" });
    if (val && val.trim().length >= 3) {
      v.title = val.trim();
      save();
      render();
    }
  } else if (kind === "witness") {
    offerWitness(v, false);
  } else if (kind === "ics") {
    download(`vow-${v.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 30)}.ics`, icsFor(v), "text/calendar");
  }
}

function debtWitness(d) {
  const v = S.vows.find((x) => x.id === d.vowId);
  return { pub: d.witnessPub || (v && v.witnessPub) || null, who: d.witness || (v && v.witness) || "your witness", v };
}

// A debt clears only with proof: a receipt image, or the witness's signed confirmation.
function payDebt(id) {
  const d = S.debts.find((x) => x.id === id);
  if (!d) {
    return;
  }
  const { pub, who, v } = debtWitness(d);
  let photo = null;
  openDialog(`<form class="stack" id="payf">
    <h2 id="dlg-title">Paid ${money(d.amount)}?</h2>
    <p class="muted small">A debt clears with proof: a screenshot or photo of the receipt for ${money(d.amount)} to ${esc(d.to)}${pub ? `, or ${esc(who)} confirming they saw you pay` : ""}.</p>
    <label class="field"><span>Receipt image</span><input type="file" id="pay-img" accept="image/*"></label>
    <img id="pay-prev" class="thumb" alt="Receipt preview" hidden style="width:100%;height:auto;max-height:260px">
    <label class="field"><span>Reference <span class="muted small">(optional)</span></span><input type="text" id="pay-ref" maxlength="80" placeholder="Transaction ID or a short note"></label>
    <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><span class="spacer"></span><button class="btn primary" id="pay-ok">Log payment</button></div>
    ${pub ? `<div class="stack pay-alt"><p class="small">No receipt? Ask ${esc(who)} to confirm. Their phone signs it, so the debt clears when you open their link.</p>
      <button type="button" class="btn block" id="pay-ask">Ask ${esc(who)} to confirm</button></div>` : ""}
  </form>`, (dd) => {
    $("#pay-img", dd).addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) {
        return;
      }
      photo = await compressPhoto(file, "Receipt logged");
      $("#pay-prev", dd).src = photo;
      $("#pay-prev", dd).hidden = false;
    });
    $("#payf", dd).addEventListener("submit", (e) => {
      e.preventDefault();
      if (!photo) {
        toast("Add a receipt image first (a screenshot of the transfer works).");
        return;
      }
      d.paidAt = now();
      d.receiptPhoto = photo;
      d.receipt = $("#pay-ref", dd).value.trim() || "receipt image";
      d.paidBy = "receipt";
      save();
      dlg.close();
      render();
      tellWitness("Debt settled", v, `I paid ${money(d.amount)} to ${d.to} for breaking "${d.title}". Receipt: ${d.receipt}.`);
    });
    const askBtn = $("#pay-ask", dd);
    if (askBtn) {
      askBtn.addEventListener("click", () => {
        const payload = { id: d.vowId, debt: d.id, n: S.settings.name || "", t: d.title, s: money(d.amount), to: d.to };
        const link = appUrl(`paid=${b64e(JSON.stringify(payload))}`);
        d.askedAt = now();
        save();
        shareText(`I paid ${money(d.amount)} to ${d.to} for breaking "${d.title}". Can you confirm you saw it? ${link}`);
      });
    }
  });
}

function wireSettings() {
  $("#s-name").addEventListener("change", (e) => {
    S.settings.name = e.target.value.trim();
    save();
  });
  $("#s-cur").addEventListener("change", (e) => {
    S.settings.currency = e.target.value.trim() || "$";
    save();
  });
  $$("input[name=theme]").forEach((r) => r.addEventListener("change", () => {
    S.settings.theme = r.value;
    save();
    applyTheme();
  }));
  $("#export").addEventListener("click", () => {
    const backup = { ...S, witnessing: loadWitnessing() };
    download(`vow-backup-${dateKey(now())}.json`, JSON.stringify(backup, null, 2), "application/json");
  });
  $("#import-file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) {
      return;
    }
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.vows) || !Array.isArray(data.debts)) {
        throw new Error("bad");
      }
      if (Array.isArray(data.witnessing)) {
        const restoredIds = new Set(data.witnessing.map((w) => w.id));
        const kept = loadWitnessing().filter((w) => !restoredIds.has(w.id));
        saveWitnessing([...kept, ...data.witnessing]);
      }
      delete data.witnessing;
      S = { ...blankState(), ...data };
      save();
      applyTheme();
      render();
      toast("Backup restored.");
    } catch (err) {
      toast("That file isn't a Vow backup.");
    }
  });
  $("#erase").addEventListener("click", async () => {
    const val = await ask({ title: "Erase everything?", body: "This removes your vows and history from this device. Unpaid debts stay until you pay them, and vows you witness for friends keep working.", label: "Type ERASE to confirm", ok: "Erase" });
    if (val && val.trim().toUpperCase() === "ERASE") {
      const unpaid = S.debts.filter((d) => !d.paidAt);
      S = blankState();
      S.debts = unpaid;
      save();
      applyTheme();
      location.hash = "";
      render();
      toast("Erased.");
    }
  });
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) {
    return;
  }
  const find = (id) => S.vows.find((v) => v.id === id);
  if (t.dataset.checkin) {
    checkIn(find(t.dataset.checkin));
  } else if (t.dataset.act) {
    act(t.dataset.act, find(t.dataset.id));
  } else if (t.dataset.confirm) {
    confirmProof(t.dataset.confirm);
  } else if (t.dataset.pay) {
    payDebt(t.dataset.pay);
  } else if (t.dataset.waResend) {
    const v = find(t.dataset.waResend);
    if (v) {
      offerBail(v);
    }
  } else if (t.dataset.waCancel) {
    const v = find(t.dataset.waCancel);
    if (v) {
      delete v.bailoutAsked;
      save();
      render();
      toast("Walk-away cancelled. The vow stands.");
    }
  } else if (t.dataset.undo) {
    const [vid, pid] = t.dataset.undo.split(":");
    const v = find(vid);
    const pend = (v.pending || []).find((x) => x.id === pid);
    v.pending = v.pending.filter((x) => x.id !== pid);
    if (pend && pend.cost === "debt") {
      S.debts = S.debts.filter((d) => !(d.bailout === pid && !d.paidAt));
    }
    save();
    render();
    toast("Change cancelled. The vow stands.");
  }
});

function updateCountdowns() {
  const t = now();
  $$("[data-left]").forEach((el) => {
    el.textContent = fmtLeft(Number(el.dataset.left) - t);
  });
}

window.addEventListener("hashchange", () => {
  if (dlg.open) {
    dlg.close();
  }
  render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    tick();
  }
});
applyTheme();
render();
tick();
setInterval(updateCountdowns, 1000);
setInterval(tick, 5000);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
