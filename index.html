function icsFor(v) {
  const pad = (n) => String(n).padStart(2, "0");
  const local = (ms) => {
    const d = new Date(ms);
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  };
  const icsEsc = (s) => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const o = openOcc(v) || v.occ[v.occ.length - 1];
  const start = o.due - 30 * MIN;
  const stampUtc = new Date(now()).toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Vow//Commitments//EN", "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT", `UID:${v.id}@vow`, `DTSTAMP:${stampUtc}`, `DTSTART:${local(start)}`, "DURATION:PT30M",
    `SUMMARY:${icsEsc(`Vow: ${v.title} (${money(v.stake)} at stake)`)}`,
    `DESCRIPTION:${icsEsc(`Deadline. Check in on Vow with proof or pay ${money(v.stake)} to ${v.to}.`)}`,
  ];
  if (v.kind === "repeat") {
    const until = v.until ? `;UNTIL=${local(v.until)}` : "";
    lines.push(`RRULE:FREQ=WEEKLY;BYDAY=${v.days.map((d) => ICS_DAYS[d]).join(",")}${until}`);
  }
  lines.push("BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-PT1H", `DESCRIPTION:${icsEsc(`Vow due soon: ${v.title}`)}`, "END:VALARM", "END:VEVENT", "END:VCALENDAR");
  return lines.join("\r\n") + "\r\n";
}

async function act(kind, v) {
  const o = openOcc(v);
  if (kind === "raise") {
    const val = await ask({ title: "Raise the stake", label: `New stake (now ${money(v.stake)})`, type: "number", value: v.stake * 2, min: v.stake + 1, ok: "Raise now" });
    const n = Math.round(Number(val));
    if (val === null) {
      return;
    }
    if (!(n > v.stake)) {
      toast("Raising means a bigger number.");
      return;
    }
    v.stake = n;
    v.baseStake = Math.max(v.baseStake, n);
    if (o) {
      o.stake = n;
    }
    save();
    render();
    toast(`Stake raised to ${money(n)}.`);
  } else if (kind === "lower") {
    const val = await ask({ title: "Lower the stake", body: "This waits 24 hours. A deadline before then still counts at the current stake.", label: `New stake (now ${money(v.stake)})`, type: "number", value: Math.max(1, Math.floor(v.stake / 2)), min: 1, ok: "Schedule" });
    const n = Math.round(Number(val));
    if (val === null) {
      return;
    }
    if (!(n >= 1 && n < v.stake)) {
      toast("Pick a smaller amount, at least 1.");
      return;
    }
    schedule(v, "lower", n);
  } else if (kind === "push") {
    const val = await ask({ title: "Push the deadline", body: "This waits 24 hours. If the current deadline comes first, it still counts.", label: "New deadline", type: "datetime-local", value: toLocalInput(o.due + DAY), ok: "Schedule" });
    if (val === null) {
      return;
    }
    const ms = new Date(val).getTime();
    if (!(ms > o.due)) {
      toast("Pick a later time than the current deadline.");
      return;
    }
    schedule(v, "push", ms);
  } else if (kind === "delete") {
    if (isFarOff(v)) {
      walkAway(v);
      return;
    }
    const val = await ask({ title: "Delete this vow?", body: "Deleting waits 24 hours, and any deadline before then still counts. Debts you already owe stay.", label: "Type DELETE to confirm", ok: "Schedule delete" });
    if (val === null) {
      return;
    }
    if (val.trim().toUpperCase() !== "DELETE") {
      toast("Not deleted.");
      return;
    }
    schedule(v, "delete", null);
  } else if (kind === "pass") {
    const last = S.passes.filter((p) => now() - p.at < PASS_WINDOW).sort((a, b) => b.at - a.at)[0];
    if (last) {
      toast(`Your next pass is available ${fmtWhen(last.at + PASS_WINDOW)}.`);
      return;
    }
    if (!o || o.due <= now()) {
      toast("Passes only work before the deadline.");
      return;
    }
    const val = await ask({ title: "Excuse one deadline", body: v.witnessPub
      ? `One per 30 days, only before the deadline. ${v.witness} has to approve it. Until they do, the deadline still stands (with 24 h extra for their answer).`
      : "One per 30 days, only before the deadline. This check-in is excused and your witness should know why.", label: "What happened?", ok: v.witnessPub ? `Ask ${v.witness}` : "Excuse it" });
    if (val === null) {
      return;
    }
    if (val.trim().length < 5) {
      toast("Say what happened (5+ characters).");
      return;
    }
    if (v.witnessPub) {
      o.passAsked = { at: now(), why: val.trim() };
      save();
      render();
      offerPass(v, o);
      return;
    }
    o.status = "excused";
    o.resolvedAt = now();
    o.reason = val.trim();
    S.passes.push({ at: now(), vowId: v.id });
    save();
    tick();
    render();
    tellWitness("Deadline excused", v, `I excused one deadline this month (my 1 per 30 days) on "${v.title}": ${o.reason}.`);
  } else if (kind === "proof") {
    const pendingProof = (v.pending || []).some((p) => p.type === "proof");
    if (pendingProof) {
      toast("A proof change is already scheduled. Cancel it first.");
      return;
    }
    openDialog(`<form class="stack" id="prf">
      <h2 id="dlg-title">Change proof type</h2>
      <p class="muted small">This waits 24 hours, like any change that could make the vow easier. Check-ins before then use ${esc(proofLabel[v.proof])}.</p>
      <fieldset><legend class="legend">New proof</legend><div class="chips">
        ${Object.keys(proofLabel).map((k) => `<label><input type="radio" name="nproof" value="${k}" ${k === v.proof ? "checked" : ""}><span>${proofLabel[k]}</span></label>`).join("")}
      </div></fieldset>
      <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><span class="spacer"></span><button class="btn primary">Schedule</button></div>
    </form>`, (d) => {
      $("#prf", d).addEventListener("submit", (e) => {
        e.preventDefault();
        const choice = $("input[name=nproof]:checked", d).value;
        if (choice === v.proof) {
          dlg.close();
          return;
        }
        if (choice === "witness" && !v.witness) {
          toast("Witness code proof needs a witness. Add one first.");
          return;
        }
        dlg.close();
        schedule(v, "proof", choice);
      });
    });
  } else if (kind === "reword") {
    if (!freeEdit(v)) {
      toast("The wording is sealed now.");
      return;
    }
    const val = await ask({ title: "Fix the wording", body: "Only the words change. Stake, deadline and witness stay sealed.", label: "I will…", value: v.title, ok: "Save" });
    if (val && val.trim().length >= 3) {
      v.title = val.trim();
      save();
      render();
    }
  } else if (kind === "witness") {
    if (!v.witness) {
      const name = await ask({ title: "Add a witness", body: "They get a link, accept on their phone, and from then on confirm your proof.", label: "Witness name", ok: "Continue" });
      if (!name || !name.trim()) {
        return;
      }
      v.witness = name.trim().slice(0, 40);
      v.autoAccept = v.autoAccept !== false;
      save();
      render();
    }
    offerWitness(v, false);
  } else if (kind === "ics") {
    download(`vow-${v.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 30)}.ics`, icsFor(v), "text/calendar");
  }
}

function debtWitness(d) {
  const v = S.vows.find((x) => x.id === d.vowId);
  return { pub: d.witnessPub || (v && v.witnessPub) || null, who: d.witness || (v && v.witness) || "your witness", v };
}

// A debt clears only with proof: a receipt image, or the witness's signed confirmation.
function payDebt(id) {
  const d = S.debts.find((x) => x.id === id);
  if (!d) {
    return;
  }
  const { pub, who, v } = debtWitness(d);
  let photo = null;
  openDialog(`<form class="stack" id="payf">
    <h2 id="dlg-title">Paid ${money(d.amount)}?</h2>
    <p class="muted small">A debt clears with proof: a screenshot or photo of the receipt for ${money(d.amount)} to ${esc(d.to)}${pub ? `, or ${esc(who)} confirming they saw you pay` : ""}.</p>
    <label class="field"><span>Receipt image</span><input type="file" id="pay-img" accept="image/*"></label>
    <img id="pay-prev" class="thumb" alt="Receipt preview" hidden style="width:100%;height:auto;max-height:260px">
    <label class="field"><span>Reference <span class="muted small">(optional)</span></span><input type="text" id="pay-ref" maxlength="80" placeholder="Transaction ID or a short note"></label>
    <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><span class="spacer"></span><button class="btn primary" id="pay-ok">Log payment</button></div>
    ${pub ? `<div class="stack pay-alt"><p class="small">No receipt? Ask ${esc(who)} to confirm. Their phone signs it, so the debt clears when you open their link.</p>
      <button type="button" class="btn block" id="pay-ask">Ask ${esc(who)} to confirm</button>
      <div id="pay-ask-out" class="stack" hidden></div></div>` : ""}
  </form>`, (dd) => {
    $("#pay-img", dd).addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) {
        return;
      }
      photo = await compressPhoto(file, "Receipt logged");
      $("#pay-prev", dd).src = photo;
      $("#pay-prev", dd).hidden = false;
    });
    $("#payf", dd).addEventListener("submit", (e) => {
      e.preventDefault();
      if (!photo) {
        toast("Add a receipt image first (a screenshot of the transfer works).");
        return;
      }
      d.paidAt = now();
      d.receiptPhoto = photo;
      d.receipt = $("#pay-ref", dd).value.trim() || "receipt image";
      d.paidBy = "receipt";
      save();
      dlg.close();
      render();
      tellWitness("Debt settled", v, `I paid ${money(d.amount)} to ${d.to} for breaking "${d.title}". Receipt: ${d.receipt}.`);
    });
    const askBtn = $("#pay-ask", dd);
    if (askBtn) {
      askBtn.addEventListener("click", () => {
        const payload = { id: d.vowId, debt: d.id, n: S.settings.name || "", t: d.title, s: money(d.amount), to: d.to };
        const link = appUrl(`paid=${b64e(JSON.stringify(payload))}`);
        d.askedAt = now();
        save();
        const out = $("#pay-ask-out", dd);
        out.innerHTML = `<textarea class="share-link" aria-label="Payment confirmation request link" readonly>${esc(link)}</textarea>
          ${qrBlock(link, "Payment confirmation request link")}`;
        out.hidden = false;
        shareText(`I paid ${money(d.amount)} to ${d.to} for breaking "${d.title}". Can you confirm you saw it? ${link}`);
      });
    }
  });
}

function wireSettings() {
  $("#s-name").addEventListener("change", (e) => {
    S.settings.name = e.target.value.trim();
    save();
  });
  $("#s-cur").addEventListener("change", (e) => {
    S.settings.currency = e.target.value.trim() || "$";
    save();
  });
  $$("input[name=theme]").forEach((r) => r.addEventListener("change", () => {
    S.settings.theme = r.value;
    save();
    applyTheme();
  }));
  $("#export").addEventListener("click", () => {
    const backup = { ...S, witnessing: loadWitnessing() };
    download(`vow-backup-${dateKey(now())}.json`, JSON.stringify(backup, null, 2), "application/json");
  });
  $("#import-file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) {
      return;
    }
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.vows) || !Array.isArray(data.debts)) {
        throw new Error("bad");
      }
      if (Array.isArray(data.witnessing)) {
        const restoredIds = new Set(data.witnessing.map((w) => w.id));
        const kept = loadWitnessing().filter((w) => !restoredIds.has(w.id));
        saveWitnessing([...kept, ...data.witnessing]);
      }
      delete data.witnessing;
      S = { ...blankState(), ...data };
      save();
      applyTheme();
      render();
      toast("Backup restored.");
    } catch (err) {
      toast("That file isn't a Vow backup.");
    }
  });
  $("#erase").addEventListener("click", async () => {
    const val = await ask({ title: "Erase everything?", body: "This removes your vows and history from this device. Unpaid debts stay until you pay them, and vows you witness for friends keep working.", label: "Type ERASE to confirm", ok: "Erase" });
    if (val && val.trim().toUpperCase() === "ERASE") {
      const unpaid = S.debts.filter((d) => !d.paidAt);
      S = blankState();
      S.debts = unpaid;
      save();
      applyTheme();
      location.hash = "";
      render();
      toast("Erased.");
    }
  });
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) {
    return;
  }
  const find = (id) => S.vows.find((v) => v.id === id);
  if (t.dataset.checkin) {
    checkIn(find(t.dataset.checkin));
  } else if (t.dataset.act) {
    act(t.dataset.act, find(t.dataset.id));
  } else if (t.dataset.confirm) {
    confirmProof(t.dataset.confirm);
  } else if (t.dataset.pay) {
    payDebt(t.dataset.pay);
  } else if (t.dataset.waResend) {
    const v = find(t.dataset.waResend);
    if (v) {
      offerBail(v);
    }
  } else if (t.dataset.waCancel) {
    const v = find(t.dataset.waCancel);
    if (v) {
      delete v.bailoutAsked;
      save();
      render();
      toast("Walk-away cancelled. The vow stands.");
    }
  } else if (t.dataset.passResend) {
    const v = find(t.dataset.passResend);
    const o = v && openOcc(v);
    if (o && o.passAsked) {
      offerPass(v, o);
    }
  } else if (t.dataset.passCancel) {
    const v = find(t.dataset.passCancel);
    const o = v && openOcc(v);
    if (o) {
      delete o.passAsked;
      save();
      render();
      toast("Pass request withdrawn. The deadline stands.");
    }
  } else if (t.dataset.wpaid) {
    witnessConfirmPaid(t.dataset.wpaid);
  } else if (t.dataset.undo) {
    const [vid, pid] = t.dataset.undo.split(":");
    const v = find(vid);
    const pend = (v.pending || []).find((x) => x.id === pid);
    v.pending = v.pending.filter((x) => x.id !== pid);
    if (pend && pend.cost === "debt") {
      S.debts = S.debts.filter((d) => !(d.bailout === pid && !d.paidAt));
    }
    save();
    render();
    toast("Change cancelled. The vow stands.");
  }
});

function updateCountdowns() {
  const t = now();
  $$("[data-left]").forEach((el) => {
    el.textContent = fmtLeft(Number(el.dataset.left) - t);
  });
}

window.addEventListener("hashchange", () => {
  if (dlg.open) {
    dlg.close();
  }
  render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    tick();
  }
});
applyTheme();
render();
tick();
setInterval(updateCountdowns, 1000);
setInterval(tick, 5000);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
